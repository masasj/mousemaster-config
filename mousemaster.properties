#   temp-screenshot-mode.timeout.duration-millis=500  (※timeoutはv85で廃止。wait方式へ)

# =============================================================================
# [20] スタックキー番犬 (2026-08-27。#100 の設定側ワークアラウンド)
#   離しイベントを失ったキーは currentlyPressedKeys に残り、_{none} 系の
#   プリコンディションを全モードで殺す (#70/#100)。エンジンの救済は10秒掃除のみで、
#   しかも食われないキー限定・macOSには無い。
#   この番犬は 500ms ごとに all-wait マクロを発火させる。発火時のコンボ準備リセットが
#   スタックキーの封鎖を洗い流し、停止が最大500msで自己回復する。OSへの注入はゼロ
#   (仮想キー wd を瞬間点灯するだけ)。
#   発見の経緯: エフェクト実験の二分探索中の偶然 (LOG.md 2026-08-27)。
#   検証: ハーネス S3/S4c (このワークアラウンド無しでは構造的に落ちる2件) が通り
#   130 PASS / 0 FAIL。スロー入力 (ctrl→1.2秒→alt) も無傷。
#   ⚠ 500ms毎の準備リセットがスイート外の何かを壊す可能性は残る。異変を感じたら
#   この節を丸ごとコメントアウトして切り分けること。
virtual-key.wd=released
normal-mode.macro.watchdog=#{*}-500 -> #wd ~wd
idle-mode.macro.watchdog=#{*}-500 -> #wd ~wd

# =============================================================================
# [24] UIヒント: ラベルを押した瞬間にクリックする (2026-08-31、2026-09-02/03 改訂)
# =============================================================================
# 作者の author.properties の click-after-ui-hint-mode を、この設定の流儀に合わせて移植。
#   変更前: a → ラベル → normal-mode に戻りカーソルが要素の上 → ; で別途クリック
#   変更後: a → ラベル → そのラベル押下が左クリックになる (1打減る)
#     修飾キーを押したままラベル → 特別扱いなし。物理的に押されている修飾キーが
#       そのままクリックに乗る (ctrl+クリック = 新タブ / alt+クリック = Chrome では
#       ダウンロード / shift+クリック = 新ウィンドウ)。
#     2026-09-02: ctrl/alt の個別扱いと \ (middlebutton) の中クリック予約を削除。
#     2026-09-03: 「shift を押したままラベル = ctrl+クリック」(v2) は撤去し、[26] の
#       shift+a (新タブ専用のヒントモード) に置き換えた。v2 は OS 上で shift を離して
#       ctrl を押す細工が要り、入場キー a の second pass 対策 (normal-mode の break) も
#       必要だった。ユーザーの意図は Vimium の F (= shift+f で新タブ用ヒント) だった。
#     ボタン保持中 (n トグルのドラッグ) は従来どおり移動だけ。クリックしない
#   hint1 / hint2 (グリッド f) は変更なし。ジャンプ専用のまま (D&D が依存している)。
# 仕組み: ラベルを完成させたキーの押下イベントは次モードでも生きている
#   (ComboWatcher: "the preparation survives the mode change")。click-after-ui-hint-mode
#   はその +uihintkey を press.left として拾い、-uihintkey で release.left → normal-mode。
#   復帰時 break-combo-preparation で押下を消すので、ラベル末尾が i/j/k/l でも動かない。
#   間違った文字は eat-unused-selection-keys (既定 true) が食うので、to.click-after は
#   ラベルを完成させたキーでしか発火しない (HintManager.selectHintKey)。
# ハーネス: U1-U9 (uiHintClickSuite)。
ui-hint-mode.to.click-after-ui-hint-mode=^{leftwin rightwin ismousepressing} +uihintkey
click-after-ui-hint-mode.indicator=normal-mode.indicator
click-after-ui-hint-mode.press.left=+uihintkey
click-after-ui-hint-mode.release.left=-uihintkey
click-after-ui-hint-mode.to.normal-mode=-uihintkey
click-after-ui-hint-mode.break-combo-preparation=-uihintkey

# =============================================================================
# [26] shift+a = 新タブで開く UIヒント (2026-09-03、Vimium の F)
# =============================================================================
# normal-mode で shift を押すと slow-mode に入る (shift は食われる) ので、「shift+a」は
# slow-mode での +a。そこから ui-hint-mode の写し (ui-hint-tab-mode) に入り、ラベル押下は
# ctrl を押してから左クリック → ブラウザは新しいタブ (バックグラウンド) で開く。
#   shift+a → ラベル : ctrl+クリック (新タブ)。shift はいつ離してもよい
#   esc / q / p     : 従来どおり取消
#   ドラッグ中      : ui-hint-mode と同じく移動のみ (ボタンは離さない)
# 仕組み:
#   ・ctrl は ui-hint-tab-mode 側 (1回目のパス) のマクロで押す。press.left は切替先の
#     2回目のパスなので必ずその後 (ジャンプ待ちで両方が積まれる場合も順序は macro → press)。
#     マクロは先頭パラレルが OS キーだけなので submit 時に同期 SendInput される。
#   ・-ctrl は wait-30 で release.left (別スレッドの SendInput) より後。Chrome はマウス
#     アップ時の修飾キーで新タブを決める。ユーザーが物理的に ctrl を押している時は
#     ^{leftctrl rightctrl} で -ctrl を送らない ([7b] の原則)。マクロもユーザーも押して
#     いないキーの release は MacroPlayer が noop にするので、ctrl が残ることはない。
#   ・入場キー a の second pass を slow-mode 側の break-combo-preparation で切る。
#     a も uihintkey なので、切らないと入場の瞬間にマクロが発火して ctrl が押されたまま
#     ヒントが表示される (esc で抜けると ctrl が残る)。ハーネス T5 (対照実験で確認)。
#   ・shift は slow-mode 入場で食われているので OS には届いていない。ラベル中に押し続けて
#     いても shift+クリック (新ウィンドウ) にはならない。
#   ・hint / 退出 / remapping は ui-hint-mode と同じ内容 (hint は参照、他は複製)。
#     ui-hint-mode 側を変えたらここも合わせること。
# ハーネス: T1-T6 (uiHintTabSuite)。
slow-mode.to.ui-hint-tab-mode=^{leftalt leftctrl leftwin rightwin} +a
slow-mode.break-combo-preparation=^{leftalt leftctrl leftwin rightwin} +a
ui-hint-tab-mode.hint=ui-hint-mode.hint
ui-hint-tab-mode.indicator=normal-mode.indicator
ui-hint-tab-mode.to.normal-mode=+esc | _{ismousepressing} ^{leftwin rightwin} +uihintkey | ^{appthatdoesnotexist.exe} | _{ishintmeshempty}
ui-hint-tab-mode.to.idle-mode=+exit
ui-hint-tab-mode.break-combo-preparation=_{ismousepressing} +uihintkey
ui-hint-tab-mode.remapping.wintaskbar=_{leftwin} +t -> +t
ui-hint-tab-mode.remapping.winnotif=_{leftwin} +b -> +b
ui-hint-tab-mode.remapping.winsnip=_{leftwin leftshift} +s -> +s
ui-hint-tab-mode.to.click-after-ui-hint-tab-mode=^{leftwin rightwin ismousepressing} +uihintkey
ui-hint-tab-mode.macro.pressctrl=^{leftwin rightwin ismousepressing} +uihintkey -> +leftctrl
click-after-ui-hint-tab-mode.indicator=normal-mode.indicator
click-after-ui-hint-tab-mode.press.left=+uihintkey
click-after-ui-hint-tab-mode.release.left=-uihintkey
click-after-ui-hint-tab-mode.macro.releasectrl=^{leftctrl rightctrl} -uihintkey -> wait-30 -leftctrl
click-after-ui-hint-tab-mode.to.normal-mode=-uihintkey
click-after-ui-hint-tab-mode.break-combo-preparation=-uihintkey

# =============================================================================
# [31] Snipaste のピン留めを z 一つで回す (2026-10-12)
# =============================================================================
# Rapture 風の「画面の一部を切り取ってその場に貼り、見ながら別アプリで作業する」を、
# Snipaste (Downloads\mousemaster_92\Snipaste-2.11.3-x64。ポータブル、ホットキーは既定のまま) と
# mousemaster の組み合わせで実現する。Snipaste の切り取りのホットキーは F13 (2026-10-20 に Snipaste の設定で
# F1 から変えた。F13 は物理キーに無いので、F1 を押しても Snipaste は反応しない)。z がそれをマクロで注入する
# (自分が注入したキーは自分のフックで無視される)。
#   z (1 回目) : スニップ開始 (Snipaste の F13 を送る)。どのアプリでも効く。
#                枠が出たら ijkl で動かし、n (左トグル) … ijkl … n でドラッグ、
#                または ; クリックで自動検出された窓/要素をそのまま選ぶ。
#   z (2 回目) : その場に貼る (Snipaste の Ctrl+T = paste to screen directly)。
#   Esc        : スニップをやめる / フォーカスのあるピンを閉じる (Snipaste の仕様。素通し)。
#   ピンを消す : ピンの上でダブルクリック (; ;)、または Esc。右クリック > 廃棄 は履歴からも消す。
#   Ctrl+F3 (物理) : 全ピンの表示/非表示 (Snipaste の既定ホットキー。F3 で idle-mode に落ちる
#                副作用あり: [1] to.idle-mode の #f3)。
# 仕組み: 仮想キー snip = 「z でスニップを始めてまだ貼っていない」。
#   ・snip 離 → z は F13 (開始) + #snip。アプリ条件なし: どこからでも始められる。
#   ・snip 押 かつ Snipaste がアクティブ → z は Ctrl+T (貼る) + ~snip。
#   ・snip 押 かつ Snipaste 以外がアクティブ (Enter やダブルクリックで抜けた後の残り) → z は F13 で
#     やり直し。Ctrl+T を他アプリに送らないための分岐 (ブラウザなら新しいタブが開く)。
#   ・snip 押 の間の Esc / Enter は素通しした上で ~snip (Snipaste 側で終わる経路を追いかける)。
#   ・残る穴: 残った snip ＋ ピンにフォーカス → z が Ctrl+T としてピンに届く (無害のはず) 1 回だけ。
#   ・アプリ名が取れない 7 秒間 ([16]) は、開始は効き、貼る方は z が素通しになるだけ。
#   ・貼った直後にピンへフォーカスが移っても、snip は離れているので次の z は開始 (F13 はグローバル
#     ホットキーなのでフォーカス先を問わない)。
# 経緯: 最初は r=開始 / z=貼る / Delete=破棄 (Shift+Esc) で入れたが、ユーザー試用で「r 始動は微妙、
#   z はいい、Delete は不要 (Esc で消える)」→ z 一本に。開始と貼るを同じキーにするには状態が要るので
#   仮想キーを使い、状態が残った時の逃げ道を上の 3 分岐で用意した。
# 注意:
#   ・スニップ中に素の z を Snipaste に渡しても無害 (R は「前回の範囲を再選択」だが z は未割当)。
#   ・修飾キーガード ^{leftalt rightalt leftctrl leftwin rightwin}: 裸の +key は修飾キー押下中も
#     一致する (過去 5 回の罠)。ctrl+z (元に戻す) はこれまで通り素通し。
#   ・キーの ^{...} ブロックはコンボに 1 つだけ (仮想キー snip も同じブロックに入れる)。アプリの
#     ^{snipaste} / _{snipaste} は別勘定なので並べてよい (Combo.java の "Multiple key ^{...} blocks")。
# ハーネス: M54 (開始→貼る→次の開始 / Esc・Enter で忘れる / 残った状態の逃げ道 / アプリ名不明 /
#   修飾キーチョード / r・del が素通しのまま)。
app-alias.snipaste=Snipaste.exe snipaste.exe
virtual-key.snip=released
normal-mode.remapping.snipstart=^{snip leftalt rightalt leftctrl leftwin rightwin} +z -> +f13 -f13 #snip
normal-mode.remapping.sniprestart=_{snip} ^{snipaste} ^{leftalt rightalt leftctrl leftwin rightwin} +z -> +f13 -f13
normal-mode.remapping.snippin=_{snip} _{snipaste} ^{leftalt rightalt leftctrl leftwin rightwin} +z -> +leftctrl +t -t -leftctrl ~snip
normal-mode.remapping.snipcancel=_{snip} +esc -> +esc -esc ~snip
normal-mode.remapping.snipcopy=_{snip} +enter -> +enter -enter ~snip
# [31b] Alt+Z = 一番古いピンを閉じる (2026-10-12)。F14 を送り、snipaste-unpin.ahk (AutoHotkey v2 常駐、
#   install-snipaste-unpin.bat で Startup 登録、remove-snipaste-unpin.bat で解除) が RegisterHotKey で受けて、
#   出現順に覚えたピンの先頭へ WM_CLOSE を投げる (フォーカス不要・キー注入なし・フックなし)。
#   理由: Snipaste の Esc はアクティブな窓にしか届かない。別アプリを触った後のピンは Esc では消せず、
#   Esc 連打も 1 枚で止まる (閉じた後のフォーカスはピンでなく元のアプリに戻る)。Ctrl+A は snip 中の
#   「全画面を範囲に」で、ピンの全選択ではない (2026-10-12 実機確認)。
#   最初は Shift+Z (slow-mode の remapping) だったが「押しにくい」→ Alt+Z に。NVIDIA のオーバーレイが
#   Alt+Z をグローバルホットキーに登録していても関係ない: normal-mode では mousemaster の LL フックが
#   先に食うので RegisterHotKey まで届かない (alt+g 事件の逆。あれは mousemaster が注入し直していた)。
#   idle-mode の Alt+Z は素通しのまま (オーバーレイを再びオンにすれば NVIDIA に行く)。
#   OS に出るのは F14 だけ、か Alt+F14 (物理 Alt の扱いはモード次第。ハーネス M55 で sent を確認、
#   AHK 側は F14 / Shift+F14 / Alt+F14 / Alt+Shift+F14 の 4 つを登録)。
#   F15 = 全部閉じる (AHK 側だけ用意、mousemaster では未割当)。arrowkey-mode (alt+ijkl の後) でも効くよう
#   同じ remapping を置く ([21] の pressaltc と同じ _{none | leftalt} 形)。
#   ハーネス M55。
normal-mode.remapping.unpinoldest=_{leftalt} +z -> +f14 -f14
arrowkey-mode.remapping.unpinoldest=_{none | leftalt} +z -> +f14 -f14

# =============================================================================
# [33] アニメーション (2026-10-15、Build 95 のレイヤー＋名前付きアニメーション)
# =============================================================================
# 方針: 「見えなかった状態を見せる」ものだけ。装飾は入れない。
#   33a 出入り   idle→normal で赤丸がポップイン (4→32→26px、0.22秒)、normal→idle で縮んで消える
#   33b スニップ中の青い点: 外した (2026-10-15。退避先は下の 33b の見出し参照)
#   33c クリック  押した場所に白いリングが広がって消える (0.4秒。ドラッグ中はそのまま)
#   33d ホイール  m / , / u / o で回している間、白い四分の一の弧が (黄色くなった) 赤丸の縁を回る (下・右は時計回り、
#                 上・左は逆回り = ユーザー案 2026-10-15)。回る速さはホイールの速さに合わせる (fast は速く、slow は
#                 ゆっくり = ユーザー案 2026-10-20)。ctrl を押している間 (ズーム) は弧を出さない (33m)
#   33m ズーム    ctrl+, (拡大) / ctrl+m (縮小) の間、斜めの矢じり 4 つが外向きに走る / 内向きに寄る (0.4 秒、残像つき)
#   33e クレーン  ドラッグ開始 (左ボタン押下中に移動、または 0.25秒以上の押下) で UFO キャッチャーの
#                 爪が上から降りてきて閉じ、離すとその場で開いて上がり、星が 5 つ散る
#                 (2026-09-11 の effects デモの移植。爪は path、蝶番まわりの回転は distance/angle で代用)
#   33f 見本 (f4/f7/f8/f9/f10/f11): 外した (2026-10-15「いったんいらない」。退避先は末尾の見出し参照)
#   33g 展開      クリック / ホイール / クレーンの start/stop を slow / super-slow / fast にも直書き
#   33h 瞬間移動  ヒント (hint1 / hint2 / ui-hint) で跳んだ時、跳び元に残像 (白い輪＋X、150ms → 淡い小輪 300ms)、
#                 跳び先に白い閃光＋収束する十字＋赤丸のポップ (240ms)。跳び自体は一瞬のまま
#   33i 見本 2    外した (2026-10-20 ユーザー「F7〜F11 のエフェクトはいらない」。退避 effects-pr/33i-refined-2026-10-20.properties.txt)
#   33j 見本 3    リアル寄り (shift+F = slow-mode): f7 煙 / f8 水面 / f9 液体 / f11 炎。ぼかし影 (indicator.shadow) 付き
#   33k 見本 4    凝った物 (ctrl+F): f7 腕時計 / f8 歯車 / f9 太陽系 (トグル、idle で止まる) / f10 電気ショック (1 回)
#   33l 起動の合図 起動した時に 1 回だけ、グリッチが収まって赤丸が点く (0.9 秒。見えなければ起動していない)
# 書き方 (Build 95): <名前>-animation.duration-millis で時計を定義、<モード>.<名前>-animation.start/stop
#   がコンボ、走っている間は _{<名前から - を抜いたもの>animation} が押されたキーとして読める。
#   レイヤーは <モード>.<層名>-indicator.<プロパティ>。キーフレームは「0% 値; 50% 値 イージング; 100% 値」。
#   follow-mouse=false の層は有効になった場所に留まる (クリックやドロップのアンカー)。
#   注意: normal-mode.indicator を参照している slow/fast/jump/window/ui-hint 系のモードにも層ごと
#   コピーされる (見た目は同じ) が、start/stop コンボは参照で引き継げない (33g で slow 系に直書き。
#   jump/window/ui-hint 系には書いていないので、そこでのクリックにはバーストは出ない)。
#   サイズの既定は 26 (ConfigurationParser)。idle-mode の主インジケータは無効のまま (層だけ使う)。
# ハーネス: M57 (出入り / クリック / ホイール / クレーン / slow 系の層が期待どおり描かれる)、M58 (瞬間移動:
#   残像が跳び元にアンカーされたまま、跳び先に閃光、Esc では出ない、hint1→hint2 で再アンカーしない)、M59 (見本 2)、
#   M60 (見本 3: 層・アンカー・ぼかし影の値)、M61 (見本 4: トグル・歯車の回転比・惑星の速さ・衛星の距離・idle で停止)、
#   M62 (電気ショック: 黄色化・稲妻の伸び・明滅・後始末)。
# プレビュー GIF: mousemaster_test_harness/anim-gif/make-gif.sh (AnimDump → render.py)。
#   (どれもオーバーレイのプロキシが setIndicator を記録し、そのティックに描かれる層の有効・サイズ・角度・アンカーを読む)。

