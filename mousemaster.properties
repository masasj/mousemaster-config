normal-mode.claw-indicator.aspect-ratio=1.8
normal-mode.claw-indicator.border-radius=3
normal-mode.claw-indicator.fill-color=#C8D0D8
normal-mode.claw-indicator.stroke-thickness=0
normal-mode.claw-indicator.y=-40 | _{grabanimation} -> 0% -70; 50% -40 smootherstep; 100% -40 | _{dropanimation} -> 0% -40; 30% -40; 100% -80 smootherstep
normal-mode.claw-indicator.fill-opacity=1 | _{grabanimation} -> 0% 0; 10% 1; 88% 1; 100% 0 | _{dropanimation} -> 0% 1; 30% 1; 100% 0
# 左の指
normal-mode.fingerl-indicator.enabled=false | _{grabanimation} -> true | _{dropanimation} -> true
normal-mode.fingerl-indicator.follow-mouse=true | _{dropanimation} -> false
normal-mode.fingerl-indicator.shape=path
normal-mode.fingerl-indicator.points=-2,0 -13,9 -12,22 -4,28 -6,14 0,4
normal-mode.fingerl-indicator.size=26
normal-mode.fingerl-indicator.fill-color=#C8D0D8
normal-mode.fingerl-indicator.stroke-thickness=0
normal-mode.fingerl-indicator.x=-5
normal-mode.fingerl-indicator.y=-36 | _{grabanimation} -> 0% -80; 50% -36 smootherstep; 100% -36 | _{dropanimation} -> 0% -36; 30% -36; 100% -76 smootherstep
normal-mode.fingerl-indicator.distance=15.4
