#     現象: ZoomIt ONでshift押しっぱなしで四角形を描く際、カーソルもインジケーターも
#       見えず位置が分からない (ijklでの移動と描画自体は可能)。v64では見えていた。
#     切り分け済み(2026-07-31 実機確認):
#       ・ZoomItはactiveモードでカーソルを独自のものに置き換える。
#       ・mousemasterを起動していない状態でも、描画中(ドラッグ中)はその置換カーソルが
#         消える。つまりカーソルが消えるのはZoomIt自身の挙動でmousemasterは無関係。
#     なぜv64と違うか: 現在は render-as-cursor=true でインジケーター＝カーソルそのもの
#       なので、ZoomItがカーソルを消せばインジケーターも消える。v64は別ウィンドウの
#       オーバーレイだったのでカーソルが隠れても残っていた。動作としては筋が通っており、
#       むしろ現在の方が一貫している(インジケーターはカーソルなのだから)。
#     残る要望: 描画中も位置が見えると便利。実現するなら
#       (a) render-as-cursor=false に戻す → #72の利点(遅延ゼロ・完全追従)を失う
#       (b) 他アプリがカーソルを隠している間だけオーバーレイに退避する挙動を作者に要望
#           (#72への追記が妥当。作者はhide-cursorの実装を持つので状態検知は可能なはず)
#     優先度: 低。不具合ではなくトレードオフの選択。
#   ・起動/再起動を楽にしたい (打鍵数を減らす)。現状: PC起動時にバッチが自動実行される
#     が、動作に不安があるためv64を起動している。手動起動が面倒。
#     案の比較 (2026-07-31時点の下調べ):
#       (A) 既存の自動起動バッチの向き先をv90へ変える  … 打鍵数ゼロ。まずこれ。
#           v90は#70/#75まわりが改善し自動リロードも効くので、v64を使う理由は薄れている。
#       (B) 「再起動」用のバッチ + ショートカットキー … 設定変更時に効く。
#           taskkill /IM mousemaster.exe /F && start "" "...\mousemaster.exe"
#           これを .lnk にして プロパティ→ショートカットキー に Ctrl+Alt+M 等を割当。
#           追加ソフト不要。Windows標準機能だけで完結。
#       (C) PowerToys Run (導入済み) … alt+e で開いて "mouse" と打つだけ。数打鍵。
#           (B)より汎用だがキーストロークは増える。
#       (D) Power Automate … exe起動のためだけには重い。(B)で足りるなら不要。
#       (E) Kinesisのマクロキー … 物理キー1つで済むが、アプリ起動を直接は行えないため
#           結局(B)のショートカットキーを叩く形になる。
#     補足: v90は設定ファイルの自動リロードが効く(v89では効かなかった)ので、
#       設定を触るたびの再起動はほぼ不要になった。体感の面倒さは既に下がっているはず。
#     次アクション: 現在のバッチの中身を確認 → (A)を適用 → 必要なら(B)を追加。
#
#  ---- 解決済み: --pre-warm-hints=true で起動すること (2026-08-02 実証) --------
#   ・mousemaster.exe --pre-warm-hints=true で起動すると本不具合は発生しない。
#     起動時ログ: HintManager "Pre-warmed 1 hint meshes in 616ms"
#     以降 "Built hint mesh window" は一切出ず、f は2回目・3回目も正常に表示。
#     616msはidle-mode中(起動直後)なので体感ゼロ。既定offなので明示指定が必要。
#     起動用: mousemaster-prewarm-test.bat
#   ・原因と結果の対応:
#       構築848ms → フック停止 → -f消失 → キー固着 → 2回目無反応
#       構築0ms   → 停止なし   → -f到達 → 固着なし → 正常
#
#  ---- 上記の原因究明の記録 (2026-08-01 TRACEログで確定) ---------------------
#   ・正体は描画不良ではなく「キーの離しイベント消失によるキー固着」だった。
#     連鎖: ヒント構築が848ms → その間フックが応答しない → Windowsの
#     LowLevelHooksTimeout(既定300ms)を超えたため -f がフックを飛ばして流れる
#     → mousemasterは「fは押されっぱなし」と誤認 → 次の +f をオートリピートと
#     みなしてComboWatcherに渡さない → モード遷移せず、カーソルも消えず、無反応。
#     証拠: 1回目の -f がフックに一度も届いていない。escは前後とも正常に通る。
#     実機確認: fを押したまま表示されるまで待って離せば、2回目も正常に表示される。
#     → #74(構築が遅い)がこの不具合の直接の原因。#70と同型の壊れ方。
#     報告用ドラフト: ISSUE-hint-key-release-lost.md
#   ・否定された仮説: 経過時間 / 設定リロード / transitionアニメーション /
#     ピクスマップキャッシュ破損。
#
#  ---- v90の描画まわりの観測 (2026-08-01) -----------------------------------
#   ・hintが「mousemaster起動後の1回目しか表示されない」(2回目以降は無反応)。
#     ログ相関 (n=10、100%一致):
#       起動 → HintMeshRenderer "Pre-warmed hint mesh windows for 1 screens"
#       → 1回目のf: "Built hint mesh window in ~1000ms" が出て表示される
#       → 2回目以降のf: hint1-modeへの遷移もキー処理も完全に同一だが
#          HintMeshRenderer のログが一切出ず、何も描画されない。
#     ・設定の自動リロードでは復活しない(リロードは再起動ではない)。
#     ・経過時間は無関係 (17秒待ってもダメ / 93秒空いてもダメ)。復活条件は再起動のみ。
#     ・エンジン側のログは成功時と失敗時で1バイトも違わない → 原因は描画層(Qt)。
#     推定: #74対策で入ったピクスマップキャッシュ("Cached hint mesh pixmap ...
#       cache size is 1")の導入で、キャッシュヒット時に描画されない経路がある。
#     回避策: mousemasterを再起動する以外に無い(実用上つらい)。
#
#  ---- 既知の未解決問題 (設定では直せない / GitHub issue報告済み) -----------
#   ・#71 は v91(dd4e689) で修正済み。値の末尾にリテラルの \ が要るときは \\ と2つ書く。
#     (パーサが末尾の \ の個数を数え、奇数なら継続行、偶数なら継続せず \\ を \ に戻す)
#     middlebutton の f23 ダミーキー回避策はもう不要。ただし1つだけ書くと今も次行を飲む。
# =============================================================================

configuration-keyboard-layout=us-qwerty
normal-mode.indicator.render-as-cursor=true
# アプリ判定用エイリアス (実機ログの WindowsActiveAppFinder で確認したプロセス名)。
# App名の照合は大文字小文字を区別するが、ログ上 Claude.exe/claude.exe の両方で
# 記録されている(検出タイミングにより表記が変わる模様)ため両方登録する。
app-alias.claudeapp=Claude.exe claude.exe
# --- ログ設定 ---
# 2026-07-26: 調査完了につき安全側へ戻した。
#   DEBUG + redact-keys=false は打鍵内容が平文でログに残る (パスワードを打てばそれも残る)。
#   #70 の調査では強力な武器だったが、常用するのは危険。
#   作者から issue で追加調査の依頼が来たら、その時だけ一時的に戻すこと。
#   戻し方: level=DEBUG かつ redact-keys=false にして mousemaster を再起動。
#   ※調査時のログは mousemaster-logs-20260726.tar.enc に暗号化して保管済み。
# 2026-07-31: #74の計測完了につきINFOへ戻した。
#   計測結果: 影あり 717〜1752ms(中央値874) / 影を切ると Built ログ自体が消えるが体感は微改善のみ。
#   → Built hint mesh window は実際のコストを測りきれていない可能性。#74にその旨を報告済み。
logging.level=INFO
logging.to-file=true
logging.file-path=mousemaster.log
# 2026-08-21 redact-keys は deprecated (d6c21ff) → key-redaction に移行
# pseudonymize = キー内容は伏せつつ press/release の対応は追える（#93の新機能）
logging.key-redaction=pseudonymize
# stuck key 発生時の解析用: 終了時に直近32キーイベントをダンプ（内容はpseudonymized）
log-last-key-events-on-exit=true
# 2026-09-02 [25]: コンソール窓を出さない (作者の正式機能 fc8030b2)。
#   復帰/起動直後にコンソールが「選択」モード (QuickEdit) に入って出力が詰まり、
#   窓が残る件の根治。窓が無ければ選択モードに入りようがない。ログは上の to-file で
#   mousemaster.log に出ている。終了は × が無いので stop-mousemaster.bat (UAC 1回)。
#   コンソールを見たい時はここを false にすればリロードで再表示される
#   (Mousemaster.loadConfiguration が show/hide を切り替える)。
#   起動〜設定読込の間 (約1秒) は窓が存在するので、mousemaster-start.bat は /MIN で開く。
hide-console=true

# =============================================================================
# [1] キー割り当て (alias)
#     記号キーは .jp-kana サフィックスでJIS配列指定
# =============================================================================
key-alias.exit=q p
key-alias.clickthendisable=.
key-alias.up=i
key-alias.down=k
key-alias.left=j
key-alias.right=l
# 物理キー 0x0D。※v89では '^' が表に無く機能していなかった（要動作確認）
key-alias.center.jp-kana-jis=^
key-alias.center.jp-kana-ansi==
key-alias.jump=d
# ※v89では '@' が表に無く edge-mode は機能していなかった（使用0回）。
#   暫定で f8 に割当。使うなら押しやすいキーへ見直すこと。
# [削除 2026-07] key-alias.edge.jp-kana-jis=f8
# [削除 2026-07] key-alias.edge.jp-kana-ansi=f8
key-alias.wheelup=,
key-alias.wheeldown=m
key-alias.wheelleft=u
key-alias.wheelright=o
key-alias.leftbutton=;
# 物理キー 0x28（;の右）。v90でレイアウト分割により呼び名が変わったため両方定義
key-alias.rightbutton.jp-kana-jis=:
key-alias.rightbutton.jp-kana-ansi='
# 中クリック = n キー (2026-07変更)。
# 旧: ＼キー。しかし #70 のバグで ＼/￥ は ` として届き、離しイベントも来ないため
# 中クリックは3日間で一度も発火しなかった (実測: +` が191回に対し PressMiddle は0回)。
# 代替として ` を使うタップ式も試したが、実機では normal-mode 中にイベント自体が
# 届かず不発 (idle-modeでは届くのにnormal-modeでは無反応。#70の状態ズレが原因)。
# → 確実に届くキーへ移設。n は実測で3回押して3回とも +n として認識、離しも正常。
#   位置: Kinesis Freestyle Pro 右半分の最下段左端。Enterから最も遠く誤爆しにくい。
#
# ┌─ ￥/＼ に戻す手順 (#70 が修正されたら) ────────────────────────────────┐
# │ 1) すぐ下の key-alias.middlebutton=n をコメントアウトし、代わりに次を有効化:  │
# │      key-alias.middlebutton=backslash                                    │
# │    ※作者コメント(#71)より: \ キーの正式名称は "backslash"。この書き方なら  │
# │      行末が \ にならないので、f23 のようなダミーは不要。                    │
# │    ※ただし backslash は scanCode 0x2B (US配列でEnterの上) を指す。         │
# │      あなたが押していた JIS の ＼(0x73) / ￥(0x7D) とは別物で、そちらは     │
# │      jp-kana表に存在しない(#70)。#70修正後もこの行では拾えない可能性が高い。 │
# │ 2) 左ボタントグルを n に戻したい場合は、下の                                │
# │      key-alias.toggleleft=n  と  normal-mode.toggle.left=...              │
# │    のコメントを外す。                                                      │
# │ 3) 検証: mousemaster_test_harness で ./run.sh を実行。S4a/S4b が n 前提の   │
# │    ままなので、テスト側のキーも \ に直すこと。S3/S4c が PASS に変われば      │
# │    #70 が実際に直った証拠になる。                                          │
# └──────────────────────────────────────────────────────────────────────┘
# key-alias.middlebutton.jp-kana=\ f23
# 2026-07-26 検証済み: key-alias.middlebutton=backslash は実機で効かなかった。
#   作者コメント(#71)より \ キーの正式名は "backslash" だが、これが指すのは
#   scanCode 0x2B/0x56。実機で押している「/ の右隣の \ キー」は JIS の ろ キー(0x73)で、
#   jp-kana表に存在しないため ` として届く(#70)。よって backslash では拾えない。
#   → #70 で 0x73 が表に追加されるまで、このキーは一切バインドできない。
# jp-kana-jis では 0x73(= / の右隣の \ キー) が backslash として実在する。
# これが #70 修正の核心。ansi にはそのキーが無いので n のみ。
# 2026-08-14: #70 が修正され backslash(ろ, 0x73) が実機で使えることを確認済み
#   （#70 のコメントで「ろ を middle click にして使えている」と報告済み）。
#   よって jis では n を手放し、n を左ボタントグルへ返す。上の「戻す手順」の実行。
#   ansi には ろ キーが無いので n のまま。
key-alias.middlebutton.jp-kana-jis=backslash
key-alias.middlebutton.jp-kana-ansi=n
key-alias.middlebutton=n
# トグルクリック (v64から復元): n=左ボタン保持トグル, ]=右ボタン保持トグル
# 左ボタントグルは n を中クリックへ譲ったため無効化 (2026-07)。
# 3日間の実測で ToggleLeft の使用回数は0だったため実害なし。
# 2026-08-13 復活。x を割り当て。左手で押せて右手の ijkl / ; と干渉せず、
# ガードを _{none} にすることで Ctrl+X (切り取り) も殺さない。
# ※ 旧コメントは「空きキー例: r / x / z / q」と書いていたが q は誤り。
#   q は key-alias.exit=q p で normal-mode を抜けるキーとして現役。
# 2026-08-14: n を取り戻した（middlebutton を backslash 単独にしたため）。
#   x は #70 が直るまでの仮住まいだったので撤去。jis では n のみ。
#   ansi には ろ キーが無く n が中クリックのままなので、そちらだけ x を残す。
key-alias.toggleleft.jp-kana-jis=n
key-alias.toggleleft=x
# 物理キー 0x1B
key-alias.toggleright.jp-kana-jis=[
key-alias.toggleright.jp-kana-ansi=]
key-alias.fast=v b
key-alias.slow=leftshift
key-alias.superslow=leftctrl
# 物理キー 0x1A（JIS刻印では @ のキー）
key-alias.grid.jp-kana-jis=@
key-alias.grid.jp-kana-ansi=[
key-alias.hint=f
key-alias.screenselection=c
# screen-selection の選択キー（break-combo-preparation で使う）
key-alias.screenkey=j k l ; a s d f g
# UI hint (leftalt+g) の選択キー。UI要素の数だけラベルが振られる
key-alias.uihintkey=a b c d e f g h i j k l m n o p q r s t u v w x y z
# hint の選択キー。break-combo-preparation で同じ集合を参照するためエイリアス化(2026-07-31)
key-alias.hint1key=a b c d e f g h i j k l m n o p q r s t u v w x y z ; ' , leftctrl space 1 2 3 4 5 6 7 8 9 0
key-alias.hint2key=a b c d e f g h i j k l m n o p q r s t u v w x y z

# =============================================================================
# [2] 起動 (idle → normal)
#     3系統: ctrl押しながらalt / alt押しながらctrl / 押下シーケンス
#     (2番目以降は起動失敗対策で追加。※`スタック中はいずれも効かない=既知問題)
# =============================================================================
# 2026-08-22 idleからのWin+Lでlが「食べられていない幻」になり、ログイン後の
# 初回lが文字として漏れる対策: idle自己遷移でlをコンボとして食べる
idle-mode.to.idle-mode=#leftwin-0 +l | #rightwin-0 +l | _{leftwin} +l | _{rightwin} +l
idle-mode.to.normal-mode=_{leftctrl} +leftalt | _{leftalt} +leftctrl | #leftctrl-0 +leftalt

# =============================================================================
# [3] インジケーター (カーソル中心の赤丸。状態で色が変わる)
#     赤=通常/移動 黄=ホイール 緑=ボタン押下
# =============================================================================
normal-mode.indicator.enabled=true
# 2026-08-15: idle./move./wheel./mouse-press. の「状態別プロパティ」は非推奨になり、
#   起動のたびに WARN が3行出ていた。作者が警告文の中で示した書き方にそのまま置き換えた。
#   状態は _{ismoving} などのプリコンディション付きの値として1行に書く形になった。
#   置換前後で全14モードの IndicatorConfiguration が完全一致することを確認済み
#   （ハーネスのパーサで前後を dump して diff）。
# カーソル中心に固定 (デフォルトは右下でズレて見える)。opacityでカーソルを透かす
normal-mode.indicator.position=center
normal-mode.indicator.opacity=0.6
# 移動中も赤丸を表示 (normal modeであることが移動中も分かるように)。
# 円はカーソルより1フレーム遅れて描画されるため高速移動中はカーソルが円からはみ出すが、
# これはWindows描画の構造的制約 (作者へfeature request済み: カーソル画像化)。
# 赤=通常/移動 黄=ホイール 緑=ボタン押下
normal-mode.indicator.color=#FF0000 | _{ismoving} -> #FF0000 | _{iswheeling} -> #FFFF00 | _{isleftmousepressing} -> #00FF00 | _{ismiddlemousepressing} -> #FF00FF | _{isrightmousepressing} -> #00FFFF
# normal-mode.indicator.unhandled-key-press-color=#0000FF

# =============================================================================
# [4] 終了 (normal → idle) とアプリ連携remapping
#     アプリ用ショートカットをOSへ送ってからidleに戻る形 (#f2=内部の終了シグナル)
# =============================================================================
normal-mode.to.idle-mode=+exit | -clickthendisable | _{leftctrl} #e | _{leftctrl} #g | _{leftctrl} #t | #/ | #f2 | #f3 | #leftwin-0 +l | #rightwin-0 +l
# alt+d: エクスプローラーのアドレスバー → 送信後idleへ
normal-mode.remapping.altd=_{leftalt} +d -> +leftalt +d -d -leftalt #f2
# alt+e: PowerToys Run → 送信後idleへ
normal-mode.remapping.alte=_{leftalt} +e -> +leftalt +e -e -leftalt #f2
# alt+f: OneCommanderペイン切替。3段構成:
#   pressaltf   : alt+fを送る (-leftaltを送らないのはAcknowledgmentタイムアウト回避)
#   releasealtf1: 物理fの離しを転送
#   releasealtf2: 物理altの離しを捕捉し、f24タップでWindowsのaltメニュー化を抑止
#                 (Shiftタップ=IME英数誤爆 / Ctrlタップ=PowerToys Spotlight誤爆のためf24)
normal-mode.remapping.pressaltf=_{leftalt} +f -> +leftalt +f -f
normal-mode.remapping.releasealtf1=_{leftalt} -f -> -f
normal-mode.remapping.releasealtf2=^{f} -leftalt -> +f24 -f24 -leftalt
# alt+c / alt+m: OneCommander (別ペインへコピー / 移動)
# _{leftalt} 限定にすること (旧: _{none | leftalt})。none を含めると素のc/mにも一致し、
# アプリへ alt+c / alt+m が飛ぶ。実害: YouTubeで素のmを押すと下スクロールでなくミュートに
# なる (YouTube側がaltを見ずにmを処理するため)。ハーネスM28で回帰化。
normal-mode.remapping.pressaltc=_{leftalt} +c -> +leftalt +c
normal-mode.remapping.releasealtc=_{leftalt} -c -> -c -leftalt
normal-mode.remapping.pressaltm=_{leftalt} +m -> +leftalt +m
normal-mode.remapping.releasealtm=_{leftalt} -m -> -m -leftalt
# [16c] alt+g: OneCommander (dual paneトグル/ペイン間移動) へ素通し。
#   旧: alt+gはui-hint-mode起動だったが、OneCommanderのalt+gが使えなかったため変更 (2026-07)。
#   方式はalt+c/mと同系(キーを挟むのでaltメニュー誤爆せず、f24抑止は不要)。
#   _{leftalt}限定なので素のg単押しでは送出しない(plain gの誤爆防止)。
normal-mode.remapping.pressaltg=_{leftalt} +g -> +leftalt +g
normal-mode.remapping.releasealtg=_{leftalt} -g -> -g -leftalt
# ctrl+shift+f: Everything → 送信後idleへ
normal-mode.remapping.leftctrlshiftf=#leftctrl-0 #leftshift-0 +f -> +leftctrl +leftshift +f -f -leftshift -leftctrl #f2
# ctrl+f: アプリ内検索 → 送信後idleへ
normal-mode.remapping.ctrlf=_{leftctrl} +f -> +leftctrl +f -f -leftctrl #f2

# =============================================================================
# [5] マウス移動・ホイールの速度
# =============================================================================
normal-mode.mouse.initial-velocity=1600
normal-mode.mouse.max-velocity=2200
normal-mode.mouse.acceleration=1500
# ジャンプを瞬間移動にする (巨大値でアニメーション実質無効化)
#     2026-08-24: ドラッグ中だけ連続移動にする。瞬間移動だとドラッグ元の
#     DoDragDrop がカーソルを追えず、ゴーストもドロップ先の表示も追従しない。
#     実測: 14000 まで通り 17000 で壊れる（1ティック10ms換算で140px/170px）。
#     余裕を見て 10000（画面端から端で0.19秒）。普段は瞬間移動のまま。
#     ⚠ isleftmousepressing は mousemaster が押している時だけ立つ。
#     物理ボタンを保持したままのドラッグはこの分岐では拾えない。
#     2026-10-07 [29]: 作者の微動開始 (#99、fd72066: 押下中は最初の30msだけ4px、その後は全速) を
#     試すため分岐を外してみたが、OneCommander では近距離しか追従しない (微動の後の1歩が
#     約150pxを超えると切れる = 8/24 の実測と同じ)。デスクトップでは距離無関係に成功。分岐を戻した。
normal-mode.mouse.smooth-jump-velocity=1000000000 | _{isleftmousepressing} -> 4000
# [無効化 2026-08-13] grid-mode.mouse=normal-mode.mouse   ← [13] とセットで戻すこと
window-mode.mouse=normal-mode.mouse
hint1-mode.mouse=normal-mode.mouse
hint2-mode.mouse=normal-mode.mouse
screen-selection-mode.mouse=normal-mode.mouse
# [30] 2026-10-07: 移動中にここへ入ると離しが拾われず走り続ける (ハーネス M52、win+c)。離しで止める。
screen-selection-mode.stop-move.up=-up
screen-selection-mode.stop-move.down=-down
screen-selection-mode.stop-move.left=-left
screen-selection-mode.stop-move.right=-right
screen-selection-mode.stop-wheel.up=-wheelup
screen-selection-mode.stop-wheel.down=-wheeldown
screen-selection-mode.stop-wheel.left=-wheelleft
screen-selection-mode.stop-wheel.right=-wheelright
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000
normal-mode.wheel.acceleration=500

# =============================================================================
# [6] 移動開始/停止 (ijkl)
#     ^{leftalt rightalt}: alt+ijkl (矢印キーモード) との競合回避
#     _{none | leftctrl}: ctrl押下中も移動可 (ZoomIt対応)
#       ただし left (j) だけは ctrl を通さない (2026-09-20 ユーザー指示)。ctrl+j は
#       [23] の remapping.ctrlj でアプリへ渡す (Brave/Chrome のダウンロード一覧)。
#       以前は両方が発火し、ダウンロード画面が開きながらカーソルが左へ走っていた。
#       2本目の ^{...} +left にも ctrl が無かったので、両方の分岐で塞いである。
#       ハーネス M49 (a-c が本件。d-g は素の j と ctrl+i/k/l が動き続ける対照)。
# =============================================================================
normal-mode.start-move.up=_{none | leftctrl} ^{leftalt rightalt} +up | _{up} -jump
normal-mode.start-move.down=_{none | leftctrl} ^{leftalt rightalt} +down | _{down} -jump
normal-mode.start-move.left=_{none} ^{leftalt rightalt} +left | ^{leftctrl leftalt rightalt leftwin rightwin} +left | _{left} -jump
normal-mode.start-move.right=_{none | leftctrl} ^{leftalt rightalt} +right | ^{leftalt rightalt leftwin rightwin} +right | _{right} -jump
# 停止: キーを離す or edge/jump/grid/hint/画面選択/UIヒントキーを押した時
#
# 2026-08-15: +a (UIヒント) だけがこの4行から漏れていた。
#   移動中に a を押すと ui-hint-mode に移るが StopMove が発行されず、
#   移動キーの離しは ui-hint-mode 側に落ちて誰にも拾われないため、
#   カーソルが押していないのに動き続ける（ログ実測: 13:07:14.989 開始 →
#   idle-mode 到達 19.129 で停止＝約4.1秒）。
#   ガードは 750 行の to.ui-hint-mode と同じにしてある
#   （_{leftalt} +a は仮想デスクトップ切替の remapping なので除外必須）。
# 2026-09-05 [28]: 暴走ブレーカー。移動キーを 10 秒 (ホイールは 20 秒) 押し続けたら止める。
#   Windows App (リモートデスクトップ) の全画面中に l の離しが届かず、ctrl+alt+del まで右へ
#   走り続けた (#100 のケース B が実運用で発生。他アプリのフックが離しを飲むと mm は永久に
#   押下中と信じる)。`+X #!{X}-10000` = X を押してから X のイベント以外を無視して 10 秒待つ。
#   本物の離しが来れば待ちは切れるので、10 秒未満の保持は無影響。裸の +X は Win+I 等を
#   食うのでガード必須 (M35g-j で検出)。ハーネス M48 (対照実験: 無しだと M48b/M48i が落ちる)。
normal-mode.stop-move.up=-up | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftalt rightalt leftwin rightwin} +up #!{up}-10000
normal-mode.stop-move.down=-down | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftalt rightalt leftwin rightwin} +down #!{down}-10000
normal-mode.stop-move.left=-left | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftalt rightalt leftwin rightwin} +left #!{left}-10000
normal-mode.stop-move.right=-right | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftalt rightalt leftwin rightwin} +right #!{right}-10000

# =============================================================================
# [7] クリック・トグル・ホイール操作
#     _{none | leftctrl}: ctrl+クリックを可能にするための登録
# =============================================================================
normal-mode.press.left=_{none | leftctrl} +leftbutton | _{none | leftctrl} +clickthendisable
normal-mode.press.middle=^{leftwin rightwin} +middlebutton
normal-mode.press.right=_{none | leftctrl} +rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
# トグルクリック (v64から復元): 押しっぱなし状態を作れる (ドラッグ等に)
# 2026-08-13 復活。ガードは _{none} のみ。_{none | leftctrl} にすると Ctrl+X を食う。
# トグルは掛かりっぱなしなので、Ctrl+ドラッグは掛けた後に Ctrl を押せばよい。
normal-mode.toggle.left=_{none} +toggleleft
normal-mode.toggle.right=_{none | leftctrl} +toggleright
# ホイールにはアプリ条件を付けないこと。mousemasterはアクティブアプリ名を取得できない
# 期間がある("Unable to find the name of the active app"。実機で7秒続いた例あり)。
# その間は _{claudeapp} も ^{claudeapp} も成立せず、どのコンボにも一致せずキーが素通しし、
# YouTubeで m がミュートとして処理される事故が起きた。
# アプリ条件は[7b]のズーム(追加動作)にだけ使い、ここは無条件にして穴を塞ぐ。
# 2026-08-15: ^{leftwin rightwin} を追加。
#   それまで裸の +key だったため、normal-mode 中は Win+, / Win+M / Win+U / Win+O が
#   mousemaster に食われてOSに届いていなかった（ハーネス M35g-j で確認）。
#   過去5回やらかした「裸の +key は修飾キー押下中もマッチする」と同じ形。
#   ⚠ ^{leftctrl} は足さないこと。[7b] の Claude 用ズーム
#     _{claudeapp} _{leftctrl} +wheelup が死ぬ。
#   stop-wheel 側は裸のままでよい（stop-move と同じ。止まる方は常に効くべき）。
normal-mode.start-wheel.up=^{leftwin rightwin} +wheelup
normal-mode.start-wheel.down=^{leftwin rightwin} +wheeldown
normal-mode.start-wheel.left=^{leftwin rightwin} +wheelleft
normal-mode.start-wheel.right=^{leftwin rightwin} +wheelright
# 2026-09-03 [27]: ホイール中にモードを抜けるキー (f/a/d/@/screenselection) を押すと
#   ホイールが止まらず、m を離しても (離しは hint1-mode 等に届くので) 止まらない。
#   stop-move と同じ入場キーを並べる (M36 と同じ穴。ハーネス M36w、対照実験で確認)。
normal-mode.stop-wheel.up=-wheelup | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftwin rightwin} +wheelup #!{wheelup}-20000
normal-mode.stop-wheel.down=-wheeldown | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftwin rightwin} +wheeldown #!{wheeldown}-20000
normal-mode.stop-wheel.left=-wheelleft | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftwin rightwin} +wheelleft #!{wheelleft}-20000
normal-mode.stop-wheel.right=-wheelright | ^{leftwin rightwin} +jump | ^{leftwin rightwin} +grid | ^{leftwin rightwin} +hint | ^{leftalt leftctrl leftwin rightwin} +screenselection | ^{leftalt leftctrl leftwin rightwin} +a | ^{leftwin rightwin} +wheelright #!{wheelright}-20000
normal-mode.move-to-grid-center=+center

# =============================================================================
# [7b] アプリ限定リマップ: Claude ではctrl+ホイールが効かない (Electron製で
#      ctrl+wheel非対応)。ctrl+, / ctrl+m をズームショートカット(ctrl+= / ctrl+-)へ変換。
#      ハーネスで検証済み: claude.exeの時だけ発火、他アプリでは従来通りホイール。
#      = キーは物理的な+キー(shift不要)。ChromiumはCtrl+=もズームインとして扱う。
# =============================================================================
# macroではCtrlに触らないこと。ユーザーが物理的にCtrlを押しており、それは
# mustBeEaten=false でOSに届いている(実機ログで確認)。macroが -leftctrl を送ると
# OS上でCtrlが離され、連打時に「Ctrlのダブルタップ」と解釈されてClaudeのクイック
# タスクが誤爆する。Windows版にはクイックエントリ無効化トグルが無いため(anthropics/
# claude-code#22420)、mousemaster側でCtrlを触らないことで回避する。
# 拡大に = を使ってはいけない。mousemasterのjp-kana表はUS配列のコピーなので(#70)
# = を VK_OEM_PLUS として送るが、日本語キーボードドライバでは VK_OEM_PLUS は
# 「; +」キーである。結果 Claude には Ctrl+; が届き、クイックタスクが開いていた。
# テンキーの + (numpadadd) は配列非依存の独立した仮想キーなので安全。
# 縮小の minus は VK_OEM_MINUS で、日本語配列でも同じ「-」キーなのでそのままでよい。
normal-mode.remapping.zoominclaude=_{claudeapp} _{leftctrl} +wheelup -> +numpadadd -numpadadd
normal-mode.remapping.zoomoutclaude=_{claudeapp} _{leftctrl} +wheeldown -> +minus -minus

# =============================================================================
# [8] slow-mode (leftshift押下中: 低速移動)
#     +slowを食べるのはホイール中のみ (食べないとshift+縦スクロールが横扱いになるアプリがある)
# =============================================================================
# 2026-08-01: 素の +slow に ^{leftalt} ガードを追加 (ハーネスM33)。
#   ガードが無いとalt押しっぱなし中のshiftもslow-mode起動に吸われ、OSにshiftが
#   届かない。実害: alt+tabの切替画面でshift+tabが「1つ戻る」でなく「1つ進む」に
#   なる。ctrl+c(項番9)/ctrl+v(項番14)とまったく同じ罠。
# 2026-08-28: ctrl押下中の枝だけ +slow -> #slow (# = OSにも通す) にし、素の枝に
#   ^{leftctrl} を追加。
#   実害: ctrl押下中の shift が slow-mode 起動に吸われ、**Ctrl+Shift+Esc**
#   (タスクマネージャー) が normal-mode 中に一切効かなかった。ハーネス M47 が再現。
#   ⚠ 素の枝まで # にすると M6b/M24 が落ちる: super-slow の ctrl+shift+○ マクロは
#   +leftshift...-leftshift を自前で送るので、物理shiftがOSに通っていると
#   合成の +leftshift が省かれる一方 -leftshift だけが飛び、ユーザーが押し続けて
#   いるのにOS側のshiftが解放される。だから **素の shift は今まで通り食べる**。
#   ctrl+shift 経路は slow-mode 止まり(super-slow は新規のctrl押下が要る)なので
#   このマクロ群には触れない。
normal-mode.to.slow-mode=^{leftalt leftctrl} +slow | _{wheelup | wheeldown} +slow | _{leftctrl} #slow
slow-mode.to.normal-mode=-slow
slow-mode.to.super-slow-mode=+superslow
slow-mode.to.jump-mode=+jump
# [削除 2026-07] slow-mode.to.edge-mode=+edge
slow-mode.indicator=normal-mode.indicator
slow-mode.mouse=normal-mode.mouse
slow-mode.wheel=normal-mode.wheel
slow-mode.mouse.max-velocity=350
slow-mode.wheel.max-velocity=200
slow-mode.start-move=normal-mode.start-move
slow-mode.stop-move=normal-mode.stop-move
slow-mode.press=normal-mode.press
slow-mode.release=normal-mode.release
slow-mode.toggle=normal-mode.toggle
slow-mode.start-wheel=normal-mode.start-wheel
slow-mode.stop-wheel=normal-mode.stop-wheel
slow-mode.move-to-grid-center=+center

# =============================================================================
# [9] super-slow-mode (leftshift+leftctrl: 極低速移動)
#     ＋「shift→ctrl+shift+○」系ショートカット群 (Chrome/Everything/エディタ等)
# =============================================================================
super-slow-mode.to.normal-mode=^{slow} -superslow
super-slow-mode.to.super-slow-mode=+slow
super-slow-mode.to.slow-mode=_{slow} -superslow
super-slow-mode.indicator=normal-mode.indicator
super-slow-mode.mouse=normal-mode.mouse
super-slow-mode.wheel=normal-mode.wheel
super-slow-mode.mouse.max-velocity=75
super-slow-mode.wheel.max-velocity=50
super-slow-mode.start-move=normal-mode.start-move
super-slow-mode.stop-move=normal-mode.stop-move
super-slow-mode.press=normal-mode.press
super-slow-mode.release=normal-mode.release
super-slow-mode.toggle=normal-mode.toggle
super-slow-mode.start-wheel=normal-mode.start-wheel
super-slow-mode.stop-wheel=normal-mode.stop-wheel

# tab: タブを前へ移動
super-slow-mode.remapping.movetableftshift=+tab -> +leftctrl +leftshift +tab -tab -leftshift -leftctrl
# b: Chromeブックマークバー表示切替
super-slow-mode.remapping.hideshowbookmarkleftshift=+b -> +leftctrl +leftshift +b -b -leftshift -leftctrl
# f: Everything (→idleへ)
super-slow-mode.remapping.everythingleftshift=+f -> +leftctrl +leftshift +f -f -leftshift -leftctrl
super-slow-mode.to.idle-mode= #f | #leftwin-0 +l | #rightwin-0 +l
# n: Chromeシークレットウィンドウ
super-slow-mode.remapping.incognitoleftshift=+n -> +leftctrl +leftshift +n -n -leftshift -leftctrl
# o: Chromeブックマーク開く
super-slow-mode.remapping.bookmarkleftshift=+o -> +leftctrl +leftshift +o -o -leftshift -leftctrl
# s: 名前を付けて保存
super-slow-mode.remapping.saveasleftshift=+s -> +leftctrl +leftshift +s -s -leftshift -leftctrl
# w: 閉じたタブを再度開く / 全タブ閉じる (※同じ+wに2定義あり。要整理: 現状は後勝ち)
super-slow-mode.remapping.reopenclosedtableftshift=+w -> +leftctrl +leftshift +w -w -leftshift -leftctrl
super-slow-mode.remapping.closealltableftshift=+w -> +leftctrl +leftshift +w -w -leftshift -leftctrl
# t: タブ復元
super-slow-mode.remapping.recovertab= +t -> +leftctrl +leftshift +t -t -leftshift -leftctrl

# --- slow-mode側の ctrl+○ 系ショートカット ---
# ctrl+f: Everything (→idleへ)
slow-mode.remapping.everythingleftshiftx=_{leftctrl} +f -> +leftctrl +leftshift +f -f -leftshift -leftctrl
slow-mode.to.idle-mode= _{leftctrl} #f | #leftwin-0 +l | #rightwin-0 +l
# ctrl+t: タブ復元
slow-mode.remapping.recovertab= _{leftctrl} +t -> +leftctrl +leftshift +t -t -leftshift -leftctrl
# ctrl+o: ブラウザのお気に入りを開く
slow-mode.remapping.openfavorite= _{leftctrl} +o -> +leftctrl +leftshift +o -o -leftshift -leftctrl
# ctrl+tab: タブを前へ移動
slow-mode.remapping.movetabbackward=_{leftctrl} +tab -> +leftctrl +leftshift +tab -tab -leftshift -leftctrl

# =============================================================================
# [10] fast-mode (v/b押下中: 高速移動)
# =============================================================================
# ^{leftctrl leftalt}: ctrl+v(貼り付け) / ctrl+b / alt+v 等をfast-modeに吸わせないため。
# これが無いと素の+fast判定がctrl保持中でも一致し、Ctrl+Vが食われて貼り付けが効かない
# (ctrl+cと同じ罠。項番9参照。2026-07 実機ログで特定)
normal-mode.to.fast-mode=^{leftctrl leftalt leftwin rightwin} +fast
fast-mode.to.normal-mode=-fast
fast-mode.to.jump-mode=+jump
# [削除 2026-07] fast-mode.to.edge-mode=+edge
fast-mode.indicator=normal-mode.indicator
fast-mode.mouse=normal-mode.mouse
fast-mode.mouse.max-velocity=4500
fast-mode.mouse.acceleration=3000
fast-mode.wheel.max-velocity=10000
fast-mode.wheel.acceleration=10000
fast-mode.start-move=normal-mode.start-move
fast-mode.stop-move=normal-mode.stop-move
fast-mode.press=normal-mode.press
fast-mode.release=normal-mode.release
fast-mode.toggle=normal-mode.toggle
fast-mode.start-wheel=normal-mode.start-wheel
fast-mode.stop-wheel=normal-mode.stop-wheel
fast-mode.move-to-grid-center=+center

# =============================================================================
# [11] edge-mode (@: 画面端スナップ)
#     不可視グリッド(画面の80%x95%)の端にijklで吸着
# =============================================================================
# [削除 2026-07] normal-mode.to.edge-mode=#edge
# [削除 2026-07] edge-mode.to.edge-mode=+slow | +fast
# [削除 2026-07] edge-mode.to.normal-mode=^{slow fast} -edge
# [削除 2026-07] edge-mode.to.slow-mode=_{slow} -edge
# [削除 2026-07] edge-mode.to.fast-mode=_{fast} -edge
# [削除 2026-07] edge-mode.indicator=normal-mode.indicator
# [削除 2026-07] edge-mode.mouse=normal-mode.mouse
# [削除 2026-07] edge-mode.press=normal-mode.press
# [削除 2026-07] edge-mode.release=normal-mode.release
# [削除 2026-07] edge-mode.toggle=normal-mode.toggle
# [削除 2026-07] edge-mode.grid.area=active-screen
# [削除 2026-07] edge-mode.grid.area-width-percent=0.80
# [削除 2026-07] edge-mode.grid.area-height-percent=0.95
# [削除 2026-07] edge-mode.grid.row-count=1
# [削除 2026-07] edge-mode.grid.column-count=1
# [削除 2026-07] edge-mode.grid.line-visible=false
# [削除 2026-07] edge-mode.snap.up=+up | _{up} +edge
# [削除 2026-07] edge-mode.snap.down=+down | _{down} +edge
# [削除 2026-07] edge-mode.snap.left=+left | _{left} +edge
# [削除 2026-07] edge-mode.snap.right=+right | _{right} +edge

# =============================================================================
# [12] jump-mode (d: 中距離ジャンプ)
#     マウス中心の不可視グリッド(画面の50%)の端へijklでジャンプ
#     ^{leftalt}: alt+d (アドレスバー) との競合回避
# =============================================================================
normal-mode.to.jump-mode=^{leftalt leftwin rightwin} +jump
jump-mode.to.jump-mode=+slow | +fast
jump-mode.to.normal-mode=^{slow fast} -jump
jump-mode.to.slow-mode=_{slow} -jump
jump-mode.to.fast-mode=_{fast} -jump
jump-mode.indicator=normal-mode.indicator
jump-mode.mouse=normal-mode.mouse
jump-mode.stop-move=normal-mode.stop-move
jump-mode.grid.area=active-screen
jump-mode.grid.area-width-percent=0.5
jump-mode.grid.area-height-percent=0.5
jump-mode.grid.synchronization=grid-center-follows-mouse
jump-mode.grid.line-visible=false
jump-mode.snap.up=+up | _{up} +jump
jump-mode.snap.down=+down | _{down} +jump
jump-mode.snap.left=+left | _{left} +jump
jump-mode.snap.right=+right | _{right} +jump

# =============================================================================
# [13] grid-mode (@: 2分割絞り込みグリッド) ← 2026-08-13 無効化
#     ijklで半分に絞り込み。@かescで戻る
#
#     [無効化の理由] 10px精度まで絞るのに15回前後の打鍵が必要で、ヒントの2〜3回と
#     比べて桁が違う。ユーザーが「使えない」と判断。
#
#     [やったこと] 入口の遷移1行をコメントアウトしただけ。これで grid-mode は
#     どのキーからも到達できなくなる。下のブロックは**到達不能だが残してある**
#     （消すと戻すのが面倒なだけで、残してもコストは無い）。
#     **戻す場合は次の行のコメントを外すだけでよい。**
#
#     [注意] `@` (=+grid) は grid-mode 専用ではない。以下ではまだ現役なので、
#     `@` を別の用途に割り当てる時は必ず両方を確認すること:
#       - [14] slow-mode.to.window-mode=+grid       … shift+@ でwindow-mode
#       - [14] window-mode.move-to-grid-center=+grid … window-mode内で中央へ
#       - [6]  normal-mode.stop-move.* の `+grid`    … 移動中に@で停止（無害だが残存）
#     つまり**空いたのは「normal-modeで単独の@を押した時」だけ**。
# =============================================================================
#     [重要] **入口の1行だけを消すことはできない。** どこからも参照されないモードが
#     残っているとパーサが弾く:
#       PARSE FAILED: Mode grid-mode is not referenced anywhere, if this is an
#       abstract mode then its name should start with _
#     そのため grid-mode の**定義もまとめてコメントアウトしてある**
#     （[5]の `grid-mode.mouse=normal-mode.mouse` も同様）。
#     **戻す場合は、以下と [5] の該当1行の「[無効化 2026-08-13]」を全部外すこと。
#     一部だけ戻すと起動しない。**
# [無効化 2026-08-13] normal-mode.to.grid-mode=^{leftwin rightwin} +grid
# [無効化 2026-08-13] grid-mode.to.normal-mode=+grid | +esc
# [無効化 2026-08-13] grid-mode.to.idle-mode=+exit
# [無効化 2026-08-13] grid-mode.indicator=normal-mode.indicator
# [無効化 2026-08-13] grid-mode.grid.area=active-screen
# [無効化 2026-08-13] grid-mode.grid.area-width-percent=0.99
# [無効化 2026-08-13] grid-mode.grid.area-height-percent=0.99
# [無効化 2026-08-13] grid-mode.grid.synchronization=mouse-follows-grid-center
# [無効化 2026-08-13] grid-mode.grid.line-visible=true
# [無効化 2026-08-13] grid-mode.grid.line-color=#FF0000
# [無効化 2026-08-13] grid-mode.shrink-grid.up=+up
# [無効化 2026-08-13] grid-mode.shrink-grid.down=+down
# [無効化 2026-08-13] grid-mode.shrink-grid.left=+left
# [無効化 2026-08-13] grid-mode.shrink-grid.right=+right

# =============================================================================
# [14] window-mode (leftshift+[: アクティブウィンドウ基準の移動)
#     ijklでウィンドウ端へ、[で中央へ。shiftを離すと終了
# =============================================================================
slow-mode.to.window-mode=+grid
window-mode.to.normal-mode=-slow
window-mode.indicator=normal-mode.indicator
window-mode.grid.area=active-window
# タイトルバーを掴めるよう上に15pxマージン
window-mode.grid.area-top-inset=15
window-mode.grid.synchronization=mouse-follows-grid-center
window-mode.grid.row-count=1
window-mode.grid.column-count=1
window-mode.grid.line-visible=true
window-mode.grid.line-color=#FF0000
window-mode.snap.up=+up
window-mode.snap.down=+down
window-mode.snap.left=+left
window-mode.snap.right=+right
window-mode.move-to-grid-center=+grid

# =============================================================================
# [15] hint1/hint2-mode (f: 画面全体ヒントジャンプ)
#     f→2文字選択でジャンプ。leftshift保持で第2ヒント(拡大精密選択)へ
#     ^{leftalt leftctrl}: alt+f (OneCommander) / ctrl+f (検索) との競合回避
# =============================================================================
normal-mode.to.hint1-mode=^{leftalt leftctrl leftwin rightwin} +hint
#     2026-08-24: 退出コンボに ^{leftwin rightwin} を追加し ui-hint-mode と揃えた。
#     以前は全キーを裸で並べており、win+t / win+b でヒントが消えていた
#     (ui-hint-mode は 2026-08-23 に対処済みで、ここだけ取り残されていた)。
#     並んでいたキーは key-alias.hint1key と同一集合なので alias に畳んである。
#     ハーネス M46b/M46c が番人。M46h が Win+L の idle 行きを守る。
hint1-mode.to.normal-mode=+esc | ^{leftwin rightwin} +hint1key
hint1-mode.to.idle-mode=+exit | #leftwin-0 +l | #rightwin-0 +l
hint1-mode.hide-cursor.enabled=true
hint1-mode.hint.type=grid
hint1-mode.hint.grid-area=active-screen
hint1-mode.hint.active-screen-grid-area-center=screen-center
# ウルトラワイド(3440x1440)向けに選択キーを拡張
# 選択キーはエイリアス化して break-combo-preparation でも同じ集合を参照する
hint1-mode.hint.selection-keys=hint1key
# 2026-08-14: hint.select が未定義だと、修飾キー保持中の選択が
#   「選択」として登録されず last-selected-hint が設定されない。
#   ZoomCenter の警告が名指ししていたのはこれ。出荷configも同じ形で書いている。
hint1-mode.hint.select=_{none | slow} +hint1key
hint1-mode.hint.grid-max-row-count=41
hint1-mode.hint.grid-cell-width=82
hint1-mode.hint.grid-cell-height=35
hint1-mode.hint.undo=backspace
# ヒント選択を終えたキーが、復帰先モードで再評価されるのを止める。
# 無いとラベル末尾が i/j/k/l の時、移動キーとして処理されカーソルがずれる。
# 作者の非推奨メッセージいわく hint.swallow-hint-end-key-press の後継がこれ。
hint1-mode.break-combo-preparation=+hint1key
# 2026-07-31 実験: 初回描画が遅い(#74)原因の切り分け。
#   exeには影の描画経路が3つあり、ログ上こちらは常に
#     "Hint label shadow: opaque text, applying effect directly"
#   を通っていた。他2経路は "pre-rendering" と書かれており最適化されている様子。
#   影を切ればその経路を回避できるか試す。効果が無ければこの行は削除してよい。
hint1-mode.hint.font-shadow-opacity=0
# 2026-08-01: transition-animation-enabled=false を試したが症状は変わらず(再起動して確認)。
#   → 「cropアニメーション中のgrabで空の絵がキャッシュされる」仮説は否定された。
#   切り分けが必要になったら下の行を復活させること:
#   hint1-mode.hint.transition-animation-enabled=false

hint1-mode.to.hint2-mode=+slow
# slow-modeからは f で直接hint2へ (leftshiftは既に押されている)
# ^{leftctrl}: ctrl+shift+f (Everything) がhintに吸われる競合の回避
slow-mode.to.hint2-mode=^{leftctrl} +hint
hint2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-mode.hint=hint1-mode.hint
# [削除 2026-08-15] hint2-mode.hint.mouse-movement=no-movement
#   リファレンス: 「no-movement は次のモードが別のヒントグリッドのときに使う」。
#   hint2 は最終段なので、選んだらカーソルが動かないと2段目の意味が無い。
#   未指定 = 既定の mouse-follows-selected-hint に戻す。
# [削除 2026-08-14] hint2-mode.to.hint1-mode=-slow
#   leftshift を離すと1段目に戻される。2段目はカーソル周辺を見るためのモードなので、
#   1段目に戻る意味が無く、押しっぱなしを強制されるのが邪魔だった。
#   抜けるのは esc / q / ラベル選択で足りる。
hint2-mode.to.idle-mode=+exit | #leftwin-0 +l | #rightwin-0 +l
#     2026-08-24: hint1 と同様に ^{leftwin rightwin} を追加。ハーネス M46e が番人。
hint2-mode.to.normal-mode=+esc | ^{leftwin rightwin} +hint2key
hint2-mode.hint.type=grid
hint2-mode.hint.grid-area=active-screen
# 2026-08-15: mouse に戻した。作者の「mouse-movement=no-movement だと等価でない」という
#   指摘は正しいが、それが効くのは「ジャンプを実行したモード」= hint1-mode の設定。
#   hint1-mode は mouse-movement 未指定 = 既定の mouse-follows-selected-hint なので、
#   f→ラベルの直後はカーソル＝選択したヒントであり、mouse で等価。
#   さらに slow-mode から直接 hint2 に入る経路では last-selected-hint が未設定になり、
#   4d03813 以降は「画面中心」にフォールバックしてしまう（カーソル周辺を見たいのに）。
#   両方の経路で正しく動くのは mouse の方。
hint2-mode.hint.active-screen-grid-area-center=mouse
hint2-mode.hint.grid-max-row-count=3
hint2-mode.hint.grid-max-column-count=8
hint2-mode.hint.grid-cell-width=10
hint2-mode.hint.grid-cell-height=15
hint2-mode.hint.selection-keys=hint2key
hint2-mode.hint.select=_{none | slow} +hint2key
hint2-mode.break-combo-preparation=+hint2key
hint2-mode.zoom.percent=5.0
hint2-mode.zoom.center=mouse
# 5倍ズーム中なのでフォント3.6=実質18px、枠0.2=実質1px
hint2-mode.hint.font-size=18
hint2-mode.hint.box-border-thickness=1

# =============================================================================
# [16] screen-selection-mode (c: マルチモニタ間ジャンプ)
# =============================================================================
# ^{leftalt leftctrl}: ctrl+c(コピー) / alt+c(OneCommanderコピー) との競合回避。
# これが無いと素の +c 判定がctrl保持中でも一致し、ctrl+cが画面選択に吸われてコピーが効かない
# (hint/jumpと同じ競合回避パターン。2026-07 実機ログで特定・修正)
normal-mode.to.screen-selection-mode=^{leftalt leftctrl} +screenselection
screen-selection-mode.to.normal-mode=+screenselection | +esc | +backspace | +j | +k | +l | +; | +a | +s | +d | +f | +g
screen-selection-mode.to.idle-mode=+exit
# 2026-08-22 M32族: 選択キーが normal-mode に持ち越されて j が左移動として再処理され
# 「中央ジャンプ後に左へ流れる」対策 (hint1/hint2/ui-hint と同じ処方)
screen-selection-mode.break-combo-preparation=+screenkey
screen-selection-mode.hint.type=grid
screen-selection-mode.hint.grid-area=all-screens
screen-selection-mode.hint.grid-max-row-count=1
screen-selection-mode.hint.grid-max-column-count=1
screen-selection-mode.hint.selection-keys=j k l ; a s d f g
screen-selection-mode.hint.font-size=120

# =============================================================================
# [16b] UI hint mode (a または F1: Vimium風のUI要素ヒント)
#     Windows UI Automation APIでアクティブウィンドウのボタン/リンク/入力欄等を検出し、
#     各要素にラベルを表示。ラベルのキーを打つとその要素へマウス移動。
#     グリッドヒント(f)より遅い(OSへのUI問い合わせが重いため)が、狙った要素に正確。
#
#     キー選定 (2026-07): 旧alt+gはOneCommanderのdual pane操作に譲ったため再割当。
#     ホームローで素の単押しが空いていたのは a と s のみ (d=jump, f=hint, g/h/j/k/l使用中)。
#     s は d(jump)の隣で誤発火が怖いため a を採用。F1 も併記して遠隔起動も可能に。
#
#     ^{leftalt leftctrl} ガード必須:
#       ・alt+a = 仮想デスクトップ左 ([20]) を巻き込まないため
#       ・ctrl+a = アプリの全選択 を食べないため (ctrl+cと同じ罠。項番9参照)
#     素のaのみUIヒントに入り、alt+a/ctrl+aは従来動作を維持する。
# =============================================================================
normal-mode.to.ui-hint-mode=^{leftalt leftctrl leftwin rightwin} +a
# 2026-08-23 138aa66: 走査結果が空ならモードを自動で抜ける（作者の新virtual key）
# 2026-08-31 [24]: ラベル確定は click-after-ui-hint-mode へ (下記)。ここに残るのは
#   esc / ボタン保持中(ドラッグ)のラベル確定=移動のみ / 空メッシュ の3経路。
ui-hint-mode.to.normal-mode=+esc | _{ismousepressing} ^{leftwin rightwin} +uihintkey | ^{appthatdoesnotexist.exe} | _{ishintmeshempty}
# ラベルキー押下後、次モードで誤コマンドが出ないよう抑止
# 2026-08-31 [24]: ドラッグ中 (normal-mode へ戻る経路) だけ。click-after 経路で切ると
#   second pass が走らず press.left が発火しない (ComboWatcher.processKeyEvent)。
ui-hint-mode.break-combo-preparation=_{ismousepressing} +uihintkey
# ==== hint系モード中でも win+t / win+b (タスクバー/通知領域フォーカス) を効かせる ====
ui-hint-mode.remapping.wintaskbar=_{leftwin} +t -> +t
ui-hint-mode.remapping.winnotif=_{leftwin} +b -> +b
hint1-mode.remapping.wintaskbar=_{leftwin} +t -> +t
hint1-mode.remapping.winnotif=_{leftwin} +b -> +b
hint2-mode.remapping.wintaskbar=_{leftwin} +t -> +t
hint2-mode.remapping.winnotif=_{leftwin} +b -> +b
# 2026-08-23 hint系モード中の Win+Shift+S (スクショ) 素通し
ui-hint-mode.remapping.winsnip=_{leftwin leftshift} +s -> +s
hint1-mode.remapping.winsnip=_{leftwin leftshift} +s -> +s
hint2-mode.remapping.winsnip=_{leftwin leftshift} +s -> +s

ui-hint-mode.to.idle-mode=+exit
ui-hint-mode.indicator=normal-mode.indicator
#     2026-08-27: ui-vision を半日試して ui-accessibility に戻した (#85)。
#     速度は34-78msと圧勝だが、ヒントが多すぎて標的を探す方が遅い(390要素/画面)。
#     つまみ(最小塊サイズ等)は現状無い。作者が調整を入れたら再試行する。
#     2026-08-30: 作者が hint.vision-density (1-8, 既定4) を追加したので再試行中。
#     密度を下げて「390個問題」が解消するかを見る。#85 に所感を返す約束がある。
#     戻すときは type を ui-accessibility に戻し、density 行をコメントアウトする。
ui-hint-mode.hint.type=ui-vision
ui-hint-mode.hint.vision-density=1
# [23] F1 の全画面UIヒント (ui-hint-all-mode) を削除 (2026-08-13)
#     [20b] で F1 に active-screen 版を割り当てたが、ユーザーが「F1でヒントは
#     出てほしくない」と判断したため撤去。F1 は 2026-07 から UIヒントの第2の
#     起動キーだったが、これで完全に未割り当てになる。
#     失うのは「背面ウィンドウのボタンをフォーカスを移さず押せる」ことだけ。
#     タスクバーと通知領域は active-screen でも元々ヒント対象外
#     （実測: UI hint bounds の maxY=1013 でタスクバー手前で止まる）。
#     復活させたければ [20b] のブロックを git 履歴から戻せばよい。
#
# [22] 左ボタントグルを x に割り当てて復活 (2026-08-13)
#     ドラッグ&ドロップが一切できない状態を解消。`[` は右ボタンのトグルなので
#     ファイルのドラッグには使えなかった。
#     **なぜ「; を押しっぱなし」ではドラッグできないのか**:
#       normal-mode.start-move.* の条件が _{none | leftctrl} で、_{none} は
#       「キーが1つも押されていない」の意味。; を押している間は押下集合が {;} に
#       なるので移動条件が成立せず ijkl が動かない。トグルなら押下集合が空のまま
#       ボタンだけ保持されるので移動できる。**この設定でドラッグを成立させる唯一の方法。**
#     ハーネス S5d-f が検証（特に S5e = ボタン保持中に移動できること）。
#
# [21] Winキーのショートカットが normal-mode 中に全部死んでいた件 (2026-08-12)
#     ユーザー報告: normal-mode 中に Win+D が効かない。
#     原因は例の「裸の +key は修飾キー保持中にもマッチする」。これで通算4回目
#     (ctrl+c / ctrl+v / alt+tab中のshift / 今回)。衝突していたのは:
#       Win+D(デスクトップ表示)=d, Win+A(クイック設定)=a, Win+F=f,
#       Win+V(クリップボード履歴)=v/b, Win+H(音声入力)=h, Win+N(通知)=n
#     対処: 該当コンボに ^{leftwin rightwin} を追加。stop-move の行にも
#     +jump / +grid / +hint が無防備で入っていたので、そちらも同様に塞いだ
#     (d と f はここで食われていた)。
#     ハーネス M35a-f が6キー分を常時検証する。期待値 96 PASS / 2 FAIL。
#     ※ _{none | leftctrl} 形式のガードは元からWinを弾いていた(左右クリック等)。
#
# [20] UIヒントを active-window に変更 (2026-08-12。実測で30倍速)
#     既定の active-screen は画面上の全ウィンドウを走査する。実機で17ウィンドウ、
#     1回あたり平均1924ms (中央値1998, 範囲1190-2778, n=20)。しかも毎回
#     同じ結果を計算し直す (キャッシュ機構が無い。HintManager 335-385行)。
#     active-window にすると平均55-96ms (n=20)。
#     決定的なのは要素数ではなくウィンドウ数:
#       67要素 / 17ウィンドウ = 1924ms
#       68要素 /  1ウィンドウ =   96ms   ← ほぼ同じ要素数で20倍差
#     副作用: 他ウィンドウのボタンはヒント対象外になる。困ったら active-screen へ。
# 2026-08-23 aをワイド化（画面上の全窓を対象。タスクバー/通知が出ないのは上流課題）
ui-hint-mode.hint.ui-area=active-screen
ui-hint-mode.hint.selection-keys=uihintkey
# 2026-08-23 winガード: win押下中はtを選択と解釈せずremapping(win+t/b)に譲る
ui-hint-mode.hint.select=^{leftwin rightwin} +uihintkey
ui-hint-mode.hint.undo=+backspace
# 見た目 (公式neo-mousekeys準拠: 青いラベルボックス+白文字)
#     2026-09-20 文字を 10pt -> 13pt (+30%) に。ユーザー要望「目が少し悪い」。
#     同時に横パディングを 8 -> 4 に減らしたので、箱の幅は前より狭い
#     (Consolas 2文字: 旧 約31px, 新 約27px)。高さは 16 -> 20px。
#     重なりについて: エンジンはラベル同士の衝突を見ない。保証しているのは
#     要素の中心が 13px*scale 以上離れていることだけ (UiAutomation.MIN_DISTANCE_
#     BETWEEN_HINTS_UNZOOMED)。つまり 13px しか離れていない2要素にはどんな字でも
#     重なる。旧設定 (箱31px) の方が重なりは大きかった。
#     2026-09-20 (同日) 13 -> 16。ユーザー「Vimium サイズが良い」。箱は約32px 幅で
#     元の 10pt/pad 8 とほぼ同じ幅、高さは 25px。これ以上は 18 が上限の目安。
ui-hint-mode.hint.font-size=16
ui-hint-mode.hint.font-weight=bold
ui-hint-mode.hint.font-color=#FFFFFF
ui-hint-mode.hint.selected-font-color=#CCCCCC
ui-hint-mode.hint.font-shadow-opacity=0
ui-hint-mode.hint.box-color=#204E8A
ui-hint-mode.hint.box-opacity=1
ui-hint-mode.hint.cell-horizontal-padding=4
ui-hint-mode.hint.cell-vertical-padding=0
ui-hint-mode.hint.box-border-opacity=1
ui-hint-mode.hint.box-border-radius=3
# 背景を薄暗くしてラベルを見やすく
ui-hint-mode.hint.background-opacity=0.2


# =============================================================================
# [17] ブラウザ戻る/進む (h/y)
# =============================================================================
# 2026-08-14: ガードに leftalt が無く、**alt+h が goback にも同時マッチしていた**。
#   alt+h は仮想デスクトップ右移動 (_{leftalt} +h) のはずが、同時にブラウザ戻るも発火し、
#   Claude デスクトップ(Electron)が一つ前の画面へ戻ってしまっていた。
#   「裸の +key は修飾キー保持中にもマッチする」の5回目。ガードは Win だけでは足りない。
normal-mode.remapping.goback=^{leftalt leftctrl leftwin rightwin} +h -> +leftalt +leftarrow -leftarrow -leftalt
normal-mode.remapping.goforward=^{leftalt leftctrl leftwin rightwin} +y -> +leftalt +rightarrow -rightarrow -leftalt

# =============================================================================
# [18] スクリーンショット / ZoomIt
# =============================================================================
# leftshift+leftwin+s でスクリーンショット
slow-mode.remapping.screenshotleftshift=+leftwin-0 +s -> +leftwin +leftshift +s -s -leftshift -leftwin
# ctrl+7: ZoomIt起動待ちに100ms確保してからnormalへ戻る
normal-mode.to.temp-ZoomIt-mode=_{leftctrl} #7
temp-ZoomIt-mode.to.normal-mode=wait-100
# [30] 100ms の待ちの間に移動キーの離しが来ると失われて走り続ける (ハーネス M52)。ここでも止める。
temp-ZoomIt-mode.stop-move.up=-up
temp-ZoomIt-mode.stop-move.down=-down
temp-ZoomIt-mode.stop-move.left=-left
temp-ZoomIt-mode.stop-move.right=-right
temp-ZoomIt-mode.stop-wheel.up=-wheelup
temp-ZoomIt-mode.stop-wheel.down=-wheeldown
temp-ZoomIt-mode.stop-wheel.left=-wheelleft
temp-ZoomIt-mode.stop-wheel.right=-wheelright

# =============================================================================
# [19] arrowkey-mode (leftalt+ijkl = 矢印キー化)
#     altを押しながらijklで矢印キーを送出。alt離しで元のモードへ復帰
#     修飾キー(shift/ctrl/win)併用の組み合わせも網羅
# =============================================================================
idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true
key-alias.directionkey=i j k l
_toarrowmode-mode.to.arrowkey-mode=_{none | leftshift*leftctrl*leftwin} +leftalt-0 +directionkey | +leftalt-0 #leftshift-0 +directionkey | +leftalt-0 #leftctrl-0 +directionkey | +leftalt-0 #leftshift-0 #leftctrl-0 +directionkey | +leftalt-0 #leftctrl-0 #leftshift-0 +directionkey | +leftalt-0 #leftwin-0 +directionkey | _{leftalt} +directionkey
idle-mode.to=_toarrowmode-mode.to
normal-mode.to=_toarrowmode-mode.to
# shift離脱直後にalt+方向キーが押されていればarrowkey-modeへ
# (^{leftshift}: shift押下中は下のテキスト選択remappingが処理)
slow-mode.to.arrowkey-mode=^{leftshift} +leftalt-0 +directionkey
# shift+alt+ijkl = テキスト選択 (shift+矢印)。
# slow-modeではleftshiftが既にOSへ届いているので矢印だけ送ればよい
slow-mode.remapping.shiftaltuparrow=_{leftalt leftshift} +up -> +uparrow
slow-mode.remapping.releaseshiftaltuparrow=-up | _{up} -leftalt | _{up} -slow -> -uparrow
slow-mode.remapping.shiftaltdownarrow=_{leftalt leftshift} +down -> +downarrow
slow-mode.remapping.releaseshiftaltdownarrow=-down | _{down} -leftalt | _{down} -slow -> -downarrow
slow-mode.remapping.shiftaltleftarrow=_{leftalt leftshift} +left -> +leftarrow
slow-mode.remapping.releaseshiftaltleftarrow=-left | _{left} -leftalt | _{left} -slow -> -leftarrow
slow-mode.remapping.shiftaltrightarrow=_{leftalt leftshift} +right -> +rightarrow
slow-mode.remapping.releaseshiftaltrightarrow=-right | _{right} -leftalt | _{right} -slow -> -rightarrow
arrowkey-mode.to.previous-mode-from-history-stack=-leftalt
# 押下時に-leftaltを送るのは素の矢印キーとしてOSに届かせるため
arrowkey-mode.remapping.pressuparrow=_{none | leftalt*leftshift*leftctrl*leftwin} +up -> -leftalt +uparrow
arrowkey-mode.remapping.releaseuparrow=-up | _{up} -leftalt -> -uparrow
arrowkey-mode.remapping.pressdownarrow=_{none | leftalt*leftshift*leftctrl*leftwin} +down -> -leftalt +downarrow
arrowkey-mode.remapping.releasedownarrow=-down | _{down} -leftalt -> -downarrow
arrowkey-mode.remapping.pressleftarrow=_{none | leftalt*leftshift*leftctrl*leftwin} +left -> -leftalt +leftarrow
arrowkey-mode.remapping.releaseleftarrow=-left | _{left} -leftalt -> -leftarrow
arrowkey-mode.remapping.pressrightarrow=_{none | leftalt*leftshift*leftctrl*leftwin} +right -> -leftalt +rightarrow
arrowkey-mode.remapping.releaserightarrow=-right | _{right} -leftalt -> -rightarrow
# [30] 2026-10-07: 移動中 (ijkl 押下中) に alt+別の方向キーでここへ入ると、移動キーの離しが上の
#   remapping に食われて誰も StopMove を出さず、normal-mode に戻っても走り続ける (実機で発生、
#   ハーネス M52b)。離しでは remapping と並行してここでも止める。ホイールも同様に塞ぐ。
arrowkey-mode.stop-move.up=-up
arrowkey-mode.stop-move.down=-down
arrowkey-mode.stop-move.left=-left
arrowkey-mode.stop-move.right=-right
arrowkey-mode.stop-wheel.up=-wheelup
arrowkey-mode.stop-wheel.down=-wheeldown
arrowkey-mode.stop-wheel.left=-wheelleft
arrowkey-mode.stop-wheel.right=-wheelright
# 2026-07 無効化: arrowkey-mode側の pressXXXarrow が既に -leftalt を送っているため、
# これは二重送信になっていた (実測: [-leftalt, -leftalt, +leftarrow])。
# v89のソースには「leftaltは他キーと同じSendInputにまとめられず、フックの確認応答を
# 待つ必要がある」という制約があり、-leftalt 1回ごとに往復が発生する。
# 二重送信は矢印が届くまでの往復を2回に増やし、遅延と順序の揺れを生む。
# → 冗長な方を外して往復を半減。ハーネスの全シナリオで矢印送出は不変(AltArrowProbe)。
# 戻す場合はコメントを外すこと。
# idle-mode.remapping.releasealt=_{leftalt} +directionkey -> -leftalt
# normal-mode.remapping.releasealt=_{leftalt} +directionkey -> -leftalt

# =============================================================================
# [20] 仮想デスクトップ切替 (leftalt+a=左 / leftalt+h=右)
#     方式: a/hを押している間だけWin+Ctrl+矢印を保持し、離した瞬間に逆順で解放。
#     - 切替はキーダウン瞬間に発生 = ラグなし
#     - 保持時間は指が決める = 切替アニメーション中の取りこぼしに強い
#     - 解放は 矢印→Ctrl→Win の逆順 = Win単独押下状態を作らない (Copilot/Start誤爆防止)
#     - altを先に離した場合はrelease2が後始末
#     (経緯: 固定wait式は 50ms=取りこぼし / 150ms=連打時のキュー遅延 が発生した)
# =============================================================================
# normal側も同じ前置を付ける: 起動コンボ由来のalt保持なら-leftaltは自動スキップされ、
# normal-mode中にaltを押し直したケース(吐き戻しが起きる)では前置が効く。
# 2026-08-15: issue #88 で作者が提示した版を試用中。元の12行版は
#   mousemaster.properties.bak-vd-12line-2026-08-15 に退避してある。
# 現行版との違いは2つ:
#   (1) タップ式（同一マクロ内で押して離す）。保持式ではないので、切替アニメーション
#       中の取りこぼしが起きないかが確認点。以前 固定wait 50ms で取りこぼした経緯あり。
#   (2) -leftalt / +f24 -f24 の前置が無い。作者の版は neo-mousekeys-ijkl 前提で、
#       あちらでは leftalt が arrowmod として食われOSに届かないため不要だった。
#       こちらは idle-mode で alt が吐き戻される。ここが効かない可能性が一番高い。
#       駄目な場合の症状: alt+a を押してもデスクトップが切り替わらない。
#       あと alt 単独アップ扱いで Windows のメニューバーが光る可能性もある。
normal-mode.remapping.leftvirtualdesktop=+leftalt +a | _{leftalt} +a -> +leftwin +leftctrl +leftarrow -leftwin -leftctrl -leftarrow
normal-mode.remapping.rightvirtualdesktop=+leftalt +h | _{leftalt} +h -> +leftwin +leftctrl +rightarrow -leftwin -leftctrl -rightarrow
idle-mode.remapping.leftvirtualdesktop=+leftalt +a | _{leftalt} +a -> +leftwin +leftctrl +leftarrow -leftwin -leftctrl -leftarrow
idle-mode.remapping.rightvirtualdesktop=+leftalt +h | _{leftalt} +h -> +leftwin +leftctrl +rightarrow -leftwin -leftctrl -rightarrow

# =============================================================================
# [21] arrowkey-mode中のOneCommander操作 (alt保持のままc/m/fを使えるように)
# =============================================================================
arrowkey-mode.remapping.pressaltc=_{none | leftalt} +c -> +leftalt +c
arrowkey-mode.remapping.releasealtc=_{none | leftalt} -c -> -c -leftalt
arrowkey-mode.remapping.pressaltm=_{none | leftalt} +m -> +leftalt +m
arrowkey-mode.remapping.releasealtm=_{none | leftalt} -m -> -m -leftalt
arrowkey-mode.remapping.pressaltf=_{none | leftalt} +f -> +leftalt +f -f
arrowkey-mode.remapping.releasealtf=_{none | leftalt} -f -> -f
# alt+g: OneCommander dual pane操作 (alt保持のarrowkey-mode中も使えるように)
arrowkey-mode.remapping.pressaltg=_{none | leftalt} +g -> +leftalt +g
arrowkey-mode.remapping.releasealtg=_{none | leftalt} -g -> -g -leftalt

# =============================================================================
# [22] slow-modeの単発remapping
# =============================================================================
# shift+enter: Discord/Teamsで送信せず改行
slow-mode.remapping.pressshiftenter=+enter -> +leftshift +enter
slow-mode.remapping.releaseshiftenter=-enter -> -enter -leftshift
# shift+; (左クリック): shift+クリック = 範囲選択
slow-mode.remapping.multipleselection=+; -> +leftshift
slow-mode.remapping.multipleselectionrelease=-; | -slow -> -leftshift
# shift+f10: コンテキストメニュー
slow-mode.remapping.contextmenuleftshiftf10=+f10 -> +leftshift +f10 -f10 -leftshift

# =============================================================================
# [23] rightalt+i/k = 矢印上下タップ
# =============================================================================
normal-mode.remapping.rightalti=_{rightalt} +i -> +uparrow -uparrow
normal-mode.remapping.rightaltk=_{rightalt} +k -> +downarrow -downarrow
idle-mode.remapping.rightalti=_{rightalt} +i -> +uparrow -uparrow
idle-mode.remapping.rightaltk=_{rightalt} +k -> +downarrow -downarrow

# ctrl+j: Chromeダウンロードリスト
normal-mode.remapping.ctrlj=_{leftctrl} #j -> +leftctrl +j -j -leftctrl

# =============================================================================
# [付録] 未使用機能のメモ (新バージョンで使える機能のテンプレ。有効化する時はコピーして使う)
# =============================================================================
# --- [v72] key aliasは現在のレイアウトに自動変換される。レイアウト固定指定の例:
#   key-alias.hint1key.us-qwerty=q w e r t a s d f g z x c v b y u i o p h j k l ; n m , . /
#   key-alias.hint2key.us-qwerty=q w e r u i o p a s d f j k l ; z x c v m , . /
#   key-alias.extendedhint1key.us-qwerty=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ; z x c v b n m , . /
#   key-alias.hintscreenselectionkey.us-qwerty=j k l ; a s d f g
# --- [v85] 起動キーの代替案 (leftalt+e / leftalt+capslock):
#   key-alias.enablebasekey.us-qwerty=e capslock
#   idle-mode.to.normal-mode=+leftalt +enablebasekey | _{leftalt} +enablebasekey
# --- [v84] インジケーターの追加スタイル:
#   normal-mode.indicator.idle.edge-count=100
