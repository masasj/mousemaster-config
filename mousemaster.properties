# ---- 33e クレーン (effects デモ 2026-09-11 の grab / drop) ----------------------------------
# 横から見た UFO キャッチャー。ドラッグが本当に始まった時 (左ボタン押下中に移動キー、または
# 0.25 秒以上の押下 = n トグルや物理マウスのドラッグ) に腕がケーブルで降りてきて指が閉じる: 掴んだ。
# 離すと離した場所で (follow-mouse=false) 指が開いて腕が上がり、星が 5 つ散る。素早いクリックには
# 何も出ない (dragging が立つ前に離れる)。
# 指は path。元のデモは「点を蝶番から並べる」ことで蝶番まわりに回っていたが、95 の rotation は層の
# 中心まわりなので、蝶番 (x=∓5, y=-36) を x/y に置き、指の中心を distance=15.4 の極座標で蝶番の
# まわりに回す (angle) のと同時に rotation で指自体を同じ角度だけ回す。左指: 中心は蝶番の左下
# (angle 205°)、開き=+40°。右指: 右下 (155°)、開き=-40°。向きが逆に見えたら角度の符号を反転。
virtual-key.dragging=released
grab-animation.duration-millis=200
normal-mode.grab-animation.start=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250
normal-mode.macro.setdragging=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250 -> #dragging
drop-animation.duration-millis=500
normal-mode.drop-animation.start=_{dragging} -isleftmousepressing
normal-mode.macro.unsetdragging=_{dragging} -isleftmousepressing -> ~dragging
# 腕 (縦線)
normal-mode.arm-indicator.enabled=false | _{grabanimation} -> true | _{dropanimation} -> true
normal-mode.arm-indicator.follow-mouse=true | _{dropanimation} -> false
normal-mode.arm-indicator.shape=line
normal-mode.arm-indicator.size=30
normal-mode.arm-indicator.rotation=90
normal-mode.arm-indicator.stroke-thickness=2
normal-mode.arm-indicator.stroke-color=#A0A8B0
normal-mode.arm-indicator.y=-65 | _{grabanimation} -> 0% -95; 50% -65 smootherstep; 100% -65 | _{dropanimation} -> 0% -65; 30% -65; 100% -105 smootherstep
normal-mode.arm-indicator.stroke-opacity=1 | _{grabanimation} -> 0% 0; 10% 1; 88% 1; 100% 0 | _{dropanimation} -> 0% 1; 30% 1; 100% 0
# 本体 (角丸の箱 18x10)
normal-mode.claw-indicator.enabled=false | _{grabanimation} -> true | _{dropanimation} -> true
normal-mode.claw-indicator.follow-mouse=true | _{dropanimation} -> false
normal-mode.claw-indicator.shape=rectangle
