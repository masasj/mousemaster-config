# ---- 33f 見本 (f4/f7/f8/f9/f10/f11): 外した (2026-10-15 ユーザー「いったんいらない」)。
#   中身は effects-pr/33b-33f-removed-2026-10-15.properties.txt に退避。戻すなら末尾に貼るだけ。

# ---- 33h 瞬間移動 (ヒントで跳んだ時の消え際と現れ際。ユーザー「DBZ の悟空みたいな」2026-10-15) --------
# 跳びは一瞬 (smooth-jump-velocity=1e9) のまま。跳び元に細い白い輪の残像が一瞬残って消え、
# 跳び先では淡い光が縮み、細い輪が外から収束して、赤丸が 4→30→26 でポップする。
# (2026-10-16 ユーザー「モダンで洗練されたのがいい」→ X のきらめきを外し、線は 1〜1.5px、光は淡く)
# 仕組み:
#   ・start はヒント選択キー (+hint1key 等)。1 文字目でも走り出すが、描くのは normal-mode 側の層なので
#     見えない。最後の文字 (跳び＋normal-mode へ) で再始動して 0 から描かれる。Esc は選択キーでないので
#     残像も閃光も出ない (1 文字目の直後の Esc だけ短く光る)。
#   ・跳び元の残像は「層の位置はアンカーされた時 (enabled かつ follow-mouse=false になった時) の
#     マウス位置に留まる」ことを使う: ヒントモードに入った瞬間から透明のまま enabled にしておき
#     (= 跳び元でアンカー)、normal-mode に戻った後もアニメ中は enabled を切らさない (アンカーが
#     引き継がれる)。注意: キーフレーム (タイムライン) を持つ層はタイムラインの開始時に
#     再アンカーされる (IndicatorManager.updateTimelines) ので、残像の層にはキーフレームを書かない。
#     明→暗の 2 段は、長さの違う 2 つのアニメで enabled を切り替えて代用 (warpghost: 150ms、
#     warpghost2: その後 300ms)。
#   ・hint1 / hint2 はインジケータ無し (hide-cursor) だが、透明な層 1 つを enabled にすると描画は
#     「透明な窓」だけなので見た目は変わらない。ui-hint-mode は normal-mode.indicator 参照なので
#     層の 3 プロパティだけ上書き。
#   ・滑らかに飛ばしたければ normal-mode.mouse.smooth-jump-velocity に `| _{warpanimation} -> 8000`
#     を足す (跳びが 0.1 秒の滑空になる。ドラッグ中の 4000 と同じ仕組み)。今は入れていない。
warp-animation.duration-millis=240
warpghost-animation.duration-millis=150
warpghost2-animation.duration-millis=300
# hintready: モードに入るキー (f / a) を押したままモードに入った瞬間にも +hint1key が評価されて
# 走り出してしまう (^{hint} では防げなかった = ハーネス M58c) ので、入ってから 60ms 後に立つ
# 仮想キーを start の前提にする。normal / idle に戻った時に離す。
virtual-key.hintready=released
hint1-mode.macro.hintready=^{hintready} #{*}-0 -> wait-60 #hintready
hint2-mode.macro.hintready=^{hintready} #{*}-0 -> wait-60 #hintready
ui-hint-mode.macro.hintready=^{hintready} #{*}-0 -> wait-60 #hintready
normal-mode.macro.hintunready=_{hintready} #{*}-0 -> ~hintready
idle-mode.macro.hintunready=_{hintready} #{*}-0 -> ~hintready
hint1-mode.warp-animation.start=_{hintready} +hint1key
hint1-mode.warpghost-animation.start=_{hintready} +hint1key
hint2-mode.warp-animation.start=_{hintready} +hint2key
hint2-mode.warpghost-animation.start=_{hintready} +hint2key
ui-hint-mode.warp-animation.start=_{hintready} +uihintkey
