# ---- 33g 他モードへの展開 ---------------------------------------------------------------------
# slow / super-slow / fast は normal-mode.indicator を参照していて層は同じだが、start/stop コンボは
# 参照で引き継げない (ConfigurationParser: アニメーションは start/stop の直書きのみ)。精密クリックは
# slow-mode (shift) でやることが多いので、クリックバースト / スピナー / クレーンの 3 つは直書きで揃える。
# クレーンは特に: normal で掴んで shift を押しながら離すと、slow 側に drop が無いと dragging が
# 立ったままになり、次の普通のクリックの離しで場違いな drop が出る。
slow-mode.click-burst-animation.start=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing
slow-mode.spin-slow-animation.start=+iswheeling | _{iswheeling} #{*}-0
slow-mode.spin-slow-animation.stop=-iswheeling
slow-mode.spin-animation.stop=#{*}-0
slow-mode.spin-fast-animation.stop=#{*}-0
slow-mode.spin-superslow-animation.stop=#{*}-0
slow-mode.grab-animation.start=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250
slow-mode.macro.setdragging=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250 -> #dragging
slow-mode.drop-animation.start=_{dragging} -isleftmousepressing
slow-mode.macro.unsetdragging=_{dragging} -isleftmousepressing -> ~dragging
super-slow-mode.click-burst-animation.start=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing
super-slow-mode.spin-superslow-animation.start=+iswheeling | _{iswheeling} #{*}-0
super-slow-mode.spin-superslow-animation.stop=-iswheeling
super-slow-mode.spin-animation.stop=#{*}-0
super-slow-mode.spin-fast-animation.stop=#{*}-0
super-slow-mode.spin-slow-animation.stop=#{*}-0
super-slow-mode.grab-animation.start=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250
super-slow-mode.macro.setdragging=^{dragging} _{isleftmousepressing} +ismoving | ^{dragging} +isleftmousepressing-250 -> #dragging
super-slow-mode.drop-animation.start=_{dragging} -isleftmousepressing
super-slow-mode.macro.unsetdragging=_{dragging} -isleftmousepressing -> ~dragging
fast-mode.click-burst-animation.start=+isleftmousepressing | +ismiddlemousepressing | +isrightmousepressing
fast-mode.spin-fast-animation.start=+iswheeling | _{iswheeling} #{*}-0
fast-mode.spin-fast-animation.stop=-iswheeling
fast-mode.spin-animation.stop=#{*}-0
fast-mode.spin-slow-animation.stop=#{*}-0
fast-mode.spin-superslow-animation.stop=#{*}-0
