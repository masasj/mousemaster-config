# ---- 33k 見本 4 (凝った物。ctrl + F7/F8/F9 でオン/オフ、2026-10-16 ユーザー「凝った物って作れる？」) ---------------
# 層を何十個も重ねて、同じ時計で別々の速さに動かすと「仕掛け」が作れる。全部 normal-mode の追従層。
# トグル: 仮想キー <name>on を立てて、同じ ctrl+F でもう一度押すと stop + 解除。idle-mode に抜けた時も止める
# (ハーネスの M52 総当たりが ctrl+f7 を 3 回押して点けっぱなしにしていたのが露見した)。
# ・ctrl+f10 電気ショック (1 回 0.9 秒): ユーザー「ピカチュウの電気ショックのデモ、精巧に」。キャラクターは描かない
#   (描けるのは放電そのもの)。帯電 (小さな火花が明滅、黄色い光が育つ) → 放電 (8 本の稲妻 path が別々の
#   タイミングで外へ伸びて明滅。黄色の太い線の上に白い芯) → 残光 (光が広がって消える、火花の残り)。
#   画面の閃光 (大きな淡黄の円盤が 2 回 step で点く)。稲妻は「長さの半分の距離に置いて半径方向に向ける」。
# ・ctrl+f7 腕時計: 文字盤 (縁 2 本・目盛り 12 本・数字 4 つ)、時針・分針・秒針 (針は「長さの半分の距離に置いて
#   半径方向に向ける」ので中心を軸に回る)、中央のキャップ。秒針は 6 秒で 1 周 (デモ用。本当の時刻とは無関係)。
# ・ctrl+f8 歯車: 12 枚・8 枚・6 枚の歯車 (path、歯は台形) が噛み合って回る。回転比は歯数の逆比 (-1.5 倍、-2 倍)、
#   位相は「歯と歯溝が向き合う」ように半ピッチずらしてある。金属っぽい勾配塗り。
# ・ctrl+f9 太陽系: 軌道 4 本、惑星 4 つ (速さは半径で違う)、土星の輪 (惑星と同じ distance/angle のキーフレーム)、
#   青い惑星の衛星 (周転円 = 100 個のキーフレームで折れ線近似。distance/angle は 1 層 1 組なので足し算できない)。
