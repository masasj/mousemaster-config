# =============================================================================
#  mousemaster.properties — v64設定のv89移植版
# =============================================================================
#  由来   : C:\Program Files\mousemaster (v64) の設定を最新版向けに移植したもの
#  検証   : Downloads\mousemaster_test_harness で自動回帰テスト可能
#           **期待値 96 PASS / 2 FAIL** (残り2件は issue #70 の意図的な再現テスト)。
#           変更したら run.sh を実行すること。PASS数が減る変更は入れない。
#  注意   : エディタで直接保存した場合は自動リロードされるが、**Cowork(マウント)経由の
#           書き換えでは自動リロードが走らない**。その場合は mousemaster の再起動が要る。
#  注意   : 値の末尾にリテラルの \ が要るときは \\ と2つ書く (issue #71、v91で修正済み)。
#           1つだけだと今も「継続行」扱いで次の行を飲み込む。
#           v64由来の f23 ダミーキー方式も残っている (middlebutton参照)。
#
#  ---- キー早見表 (2026-08-13 現状に修正。jp-kana-jis) -----------------------
#   起動: leftctrl+leftalt (順不同)     終了: q / p / . (クリック後終了)
#   移動: i=上 k=下 j=左 l=右           速度: leftshift=遅 (+leftctrl=極遅) v,b=速
#   クリック: ;=左 :=右 n または \=中   トグル: x=左 [=右 (x でドラッグ&ドロップ)
#   ホイール: ,=上 m=下 u=左 o=右
#   ジャンプ: d=jump ^=グリッド中央 f=hint a=UIヒント F1=UIヒント(全画面) c=画面選択
#   その他: h=戻る y=進む  leftalt+a/h=仮想デスクトップ  leftalt+ijkl=矢印キー
#          leftshift+@=window-mode
#   ※ 旧版の早見表は edge-mode(@) と grid-mode([) と n=左トグルを載せていたが、
#     いずれも現状と違っていた。edge-modeは2026-07に削除、grid-modeは2026-08-13に
#     無効化、nは中クリックへ移動済み。
#
#  ---- 変更履歴 (2026-07 Claudeと修正) --------------------------------------
#   1. 起動コンボにalt→ctrl逆順とシーケンス型を追加 (起動失敗対策)
#   2. インジケーターをカーソル中心に固定 (position=center)
#   3. middlebutton: v64の文字リテラル \ 方式を復元 (行末\回避のf23付き)
#   4. toggleクリック (n/]) をv64から復元 (移植時に欠落していた)
#   5. alt離し時のalt-menu抑止をf24タップに変更 (旧Shift=IME誤爆/旧Ctrl=Spotlight誤爆)
#   6. 仮想デスクトップ(alt+a/h)を「押下中のみ保持・逆順解放」式に変更 (ラグ/逆行/Copilot誤爆/取りこぼし対策)
#   7. slow-mode.to.hint2-modeに^{leftctrl}追加 (ctrl+shift+fがhintに吸われる競合の解消)
#   8. 仮想デスクトップ: 送信前にf24タップ+OSのalt引っ込めを前置 (idle/normal共通)。
#      mmが食べたaltの吐き戻しでOSにaltが残留し、2回目以降のWin+Ctrl+矢印が
#      Alt付き扱いで無視される問題の解消 (実機ログで特定、実機で修正確認済み)
#   9. ctrl+c(コピー)が効かない不具合を解消 (実機ログで特定+ハーネスM11c/d/eで回帰化)。
#      「jラベル表示+画面中央へマウス移動」の正体はscreen-selection誤起動。修正は2箇所必要:
#      screen-selectionトリガーと stop-move の +screenselection(=素の+c) 双方に
#      ^{leftalt leftctrl} ガードを追加。mode切替を止めるだけではstop-moveがcを食べ続け
#      コピーが死ぬ (ハーネスで確認)。
#  10. alt+gをui-hint-mode起動からOneCommanderへの素通しに変更 (ハーネスM26で回帰化)。
#      alt+gがmousemasterに食われOneCommanderのdual pane操作が効かなかったため。
#      alt+c/mと同系の素通しremappingを normal/arrowkey 両モードに追加。
#  11. ui-hint-modeを「素のa または F1」に再割当し復活 (ハーネスM27で回帰化)。
#      ^{leftalt leftctrl}ガード付きなので alt+a(仮想デスクトップ) と ctrl+a(全選択) は不変。
#  12. 素のm/cでアプリにalt+m/alt+cが飛ぶ不具合を修正 (ハーネスM28)。remappingの
#      precondition _{none | leftalt} は素のキーにも一致してしまうため _{leftalt} 限定に。
#      実害: YouTubeで素のmを押すとスクロールでなくミュートになっていた。
#  13. Claude限定でctrl+, / ctrl+m をズーム(ctrl+= / ctrl+-)に変換 (ハーネスM29)。
#      app-alias + _{claudeapp} によるアプリ条件。他アプリではctrl+ホイールのまま。
#      App名の照合は大文字小文字を区別する点に注意 ([1]のapp-alias参照)。
#  14. Ctrl+Vが貼り付けできない不具合を修正 (ハーネスM30)。normal-mode.to.fast-mode に
#      修飾キーガードが無く、ctrl+vがfast-mode起動に吸われてvが食われていた。
#      ^{leftctrl leftalt} を追加。項番9のctrl+cとまったく同じ罠。
#      ※設定を変えても自動リロードが効かない場合がある。効かない時はmousemasterを再起動。
#  15. ズーム拡大に = を使うのをやめ numpadadd に変更 (ハーネスM29b/b2)。
#      mousemasterのjp-kana表はUS配列コピーのため = を VK_OEM_PLUS として送るが、
#      日本語ドライバでは VK_OEM_PLUS は「; +」キー。結果 Claude に Ctrl+; が届き
#      クイックタスクが開いていた。numpadaddは配列非依存。これも#70の一症状。
#  16. ホイールからアプリ条件を撤去 (ハーネスM29g/h)。mousemasterはアクティブアプリ名を
#      取得できない期間があり("Unable to find the name of the active app"、実機で7秒)、
#      その間 _{claudeapp} も ^{claudeapp} も不成立→どのコンボにも一致せずキーが素通しし、
#      YouTubeで m がミュートとして処理される事故が起きた。
#      教訓: アプリ条件は「追加動作」にのみ使い、基本動作は無条件で必ず一致させること。
#  17. hint選択後にカーソルがずれる不具合を修正 (ハーネスM32で回帰化)。
#      ラベル末尾が i/j/k/l の時、選択を終えたキーが復帰先モードで再評価され移動キー
#      として処理されていた。ハーネスで4方向とも再現→修正後は全て解消。
#      修正: 選択キーを key-alias.hint1key/hint2key に切り出し、
#            hint1-mode.break-combo-preparation=+hint1key (hint2も同様) を追加。
#      根拠: 作者の非推奨メッセージ「hint.swallow-hint-end-key-press has been deprecated
#            and removed: use break-combo-preparation instead」。推測ではなく公認の後継。
#  18. alt+tab切替画面でshift+tabが逆方向に進む不具合を修正 (ハーネスM33)。
#      normal-mode.to.slow-mode の素の +slow に修飾キーガードが無く、alt押しっぱなし中の
#      shiftもslow-mode起動に吸われてOSへ届かず、アプリには素のtabしか渡っていなかった。
#      ^{leftalt} を追加。項番9(ctrl+c)・項番14(ctrl+v)と同じ罠で、これで3例目。
#      alt+shift+ijklのテキスト選択は normal→arrowkey 経路(#leftshift-0 素通し)に
#      切り替わるが動作は同一 (M33eで確認)。素のshiftのslow-modeも不変 (M33d)。
#
#  19. hint1-mode / ui-hint-mode の backspace を「1文字戻す」に直した (ハーネスM34)。
#      backspace に hint.undo と to.normal-mode の両方が乗っており、後者が勝って
#      いたため hint.undo が死んでいた (v64から同じ構造でずっと効いていなかった)。
#      to.normal-mode 側から +backspace を外した。モードを抜けるのは esc が担当。
#  20. grid-mode を無効化 (2026-08-13)。10px精度まで15打鍵かかりヒントの2〜3打と桁違い。
#      入口だけ消すとパーサが「参照されないモード」で弾くため、定義ごとコメントアウト。
#      詳細と戻し方は [13] のブロックコメント。**@ が空いたのは normal-mode 単独時のみ**
#      (window-mode ではまだ現役)。ハーネス M8a/M8b が到達不能を常時検査。
#  21. UIヒント(a)のラベル押下を即クリックに (2026-08-31、[24])。修飾キーは特別扱い
#      せず物理的に押されたものがそのまま乗る。ドラッグ中は従来どおり移動のみ
#      (対照実験: 無いと hint ジャンプでドロップしてしまう)。hint1/hint2 (f) は不変。
#      2026-09-02: \ の中クリック予約・alt 除外・ctrl 個別扱いを削除。ハーネス U1-U9。
#  22. hide-console=true (2026-09-02、[25])。「選択」コンソールが復帰後に残る件の根治。
#      終了は stop-mousemaster.bat。起動バッチは /MIN で開く。
#  23. shift+a = 新タブで開く UIヒント (2026-09-03、[26]、Vimium の F)。ラベルを押すと
#      ctrl+クリックになる。[24] v2 の「shift を押したままラベル」方式 (OS 上で shift を
#      離す細工が要った) はこれに置き換えて撤去。ハーネス T1-T6。
#  24. stop-wheel にモード入場キーを追加 (2026-09-03、[27])。m 押下中に f でヒントを出すと
#      ホイールが止まらなくなる不具合 (ユーザー報告)。stop-move と同じ穴 (M36)。
#  25. 暴走ブレーカー (2026-09-05、[28])。移動 10 秒 / ホイール 20 秒で自動停止。Windows App
#      全画面中に離しが消えて右へ走り続けた件 (#100 ケース B の実例)。ハーネス M48。
#  26. ドラッグ中の減速分岐を外して試験 → 戻した (2026-10-07、[29])。作者が #99 で「ジャンプの最初の
#      30ms だけ 4px の微動」を入れた (fd72066、nightly 96c7f26) が、OneCommander では
#      近距離 (1歩が約150px以下) しか追従せず、遠いと切れる。デスクトップは距離無関係に成功。
#      分岐 (ドラッグ中 4000) を戻した。結果は #99 に報告。
#  27. 移動キーを押したまま別モードへ飛ぶと止まらなくなる穴を塞いだ (2026-10-07、[30])。
#      j で移動中に alt+i/k/l (arrowkey-mode) を押し、j を arrowkey-mode の中で離すと、離しが
#      remapping に食われて normal-mode に戻っても左へ走り続けた (実機で発生。ハーネス M52 で再現:
#      arrowkey-mode / temp-ZoomIt-mode (ctrl+7) / screen-selection-mode (win+c) の 3 モード)。
#      3 モードに stop-move / stop-wheel の離しコンボを足した。モード跨ぎでは暴走ブレーカー [28]
#      も効かない (準備がリセットされる) ので、離しで止める以外に手が無い。
#  28. Snipaste のピン留め (Rapture 風の「切り取ってその場に貼る」) を z 一つで回す (2026-10-12、[31])。
#      z = スニップ開始 (Snipaste の F1 を注入)、もう一度 z = その場に貼る (Ctrl+T)。「スニップ中」は仮想キー
#      snip で覚え、Esc/Enter で抜けた時も忘れる。最初は r 開始 / z 貼る / Delete 破棄だったが、ユーザー試用で
#      「r 始動は微妙、z はいい、Delete は Esc で消えるので不要」→ z 一本に。ハーネス M54。
#      [31b] Alt+Z = 一番古いピンを閉じる (F14 → snipaste-unpin.ahk が WM_CLOSE)。Esc はアクティブな窓に
#      しか届かず、別アプリを触った後のピンを消す手が Snipaste に無いため。Shift+Z は押しにくいので Alt+Z。
#      ハーネス M55。
#
#  ---- v90への移行メモ (2026-07-30) -----------------------------------------
#   ・v90でレイアウトが jp-kana → jp-kana-jis / jp-kana-ansi に分割された(破壊的変更)。
#     旧 .jp-kana サフィックスは "Invalid keyboard layout" で起動不能になるため、
#     両レイアウト分を定義している。実機は jp-kana-jis が選択された(ログで確認)。
#   ・#70 修正済み: 半角/全角の詰まりが解消。v89では3日で110回・計30.9分停止していたが
#     v90起動後は Resetting 0回。/ の右隣の \ キー(0x73)も backslash として使えるように。
#
#  ---- TODO (2026-07-31 観測、未着手) ---------------------------------------
