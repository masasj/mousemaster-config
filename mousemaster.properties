normal-mode.macro.watchoff=_{watchon leftctrl} +f7 -> ~watchon
idle-mode.watch-animation.stop=_{watchon} #{*}-0
idle-mode.macro.watchoff=_{watchon} #{*}-0 -> ~watchon
