# =============================================================================
# [34] ちら見: w で Google カレンダーをカーソルの横に出す / 隠す (glance.ahk、2026-10-16〜17)
# =============================================================================
# mousemaster は時刻も予定も持てない (インジケータの text 層は設定に書いた文字だけ) ので、キーを 1 つ出して
# 外の AHK スクリプトに窓を出させる (snipaste-unpin.ahk と同じ作法: RegisterHotKey、フック無し)。
#   ・normal-mode の w → F16 → glance.ahk。2026-10-17 ユーザー「Google カレンダーのアプリもありそう」→ 小窓を
#     自作するのをやめ、ブラウザの --app= 窓 (タブ無しの Google カレンダーそのもの、月表示) をカーソルの横に
#     出す / 隠す (WinHide/WinShow で即時、初回だけ起動に 1〜2 秒)。本物なので予定の追加も通知も同期もそのまま。
#     打つ時は他のアプリと同じく ctrl+alt で normal-mode を抜ける。
#   ・最初に作った時計＋暦＋メモの小窓は glance-notes.ahk に残した (任意。Google Calendar API 橋渡しの
#     glance-gcal.ps1 / GLANCE-GCAL-SETUP.md もその版用)。その窓の日をクリックすると窓がアクティブになり、
#     アクティブなアプリが AutoHotkey の時だけ glance-mode (コンボを持たないモード = 全部素通し) に移って
#     メモが打てる。Esc で窓が消えてフォーカスが戻ると normal-mode。インジケータは normal-mode のまま。
#   ・idle-mode では w は素通し。
#   ・F16 は AHK 側にしか意味が無い (OS の他のアプリは無視する)。F15 は snipaste-unpin.ahk が使っているので避けた。
# ハーネス: M63 (w が F16 を送って食われる / 窓がアクティブなら glance-mode でキーが素通し、戻れば normal-mode /
#   idle では素通し)。
app-alias.glance=AutoHotkey64.exe AutoHotkey32.exe AutoHotkeyU64.exe AutoHotkey.exe
normal-mode.remapping.glance=^{leftalt rightalt leftctrl leftwin rightwin} +w -> +f16 -f16
normal-mode.to.glance-mode=_{glance}
glance-mode.indicator=normal-mode.indicator
glance-mode.to.normal-mode=^{glance}
glance-mode.to.idle-mode=#leftwin-0 +l | #rightwin-0 +l
# [30] と同じ穴の予防: 移動中に窓をクリックして glance-mode に入り、そこで移動キーを離しても止まるように
glance-mode.stop-move.up=-up
glance-mode.stop-move.down=-down
glance-mode.stop-move.left=-left
glance-mode.stop-move.right=-right
glance-mode.stop-wheel.up=-wheelup
glance-mode.stop-wheel.down=-wheeldown
glance-mode.stop-wheel.left=-wheelleft
glance-mode.stop-wheel.right=-wheelright
