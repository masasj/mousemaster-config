#  ---- キー早見表 (2026-08-13 現状に修正。jp-kana-jis) -----------------------
#   起動: leftctrl+leftalt (順不同)     終了: q / p / . (クリック後終了)
#   移動: i=上 k=下 j=左 l=右           速度: leftshift=遅 (+leftctrl=極遅) v,b=速
#   クリック: ;=左 :=右 n または \=中   トグル: x=左 [=右 (x でドラッグ&ドロップ)
#   ホイール: ,=上 m=下 u=左 o=右
#   ジャンプ: d=jump ^=グリッド中央 f=hint a=UIヒント F1=UIヒント(全画面) c=画面選択
#   その他: h=戻る y=進む  leftalt+a/h=仮想デスクトップ  leftalt+ijkl=矢印キー
#          leftshift+@=window-mode
#   ※ 旧版の早見表は edge-mode(@) と grid-mode([) と n=左トグルを載せていたが、
#     いずれも現状と違っていた。edge-modeは2026-07に削除、grid-modeは2026-08-13に
#     無効化、nは中クリックへ移動済み。
#
