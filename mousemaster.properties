spin-animation.repeat=loop
# 回る速さはホイールの速さに合わせる (2026-10-20 ユーザー「スクロール中にスピードアップしたら、回るやつも
#   スピードアップするべき」)。fast (v / b、最大 10000) 300ms・normal (最大 2000) 800ms・slow (shift、最大 200)
#   2000ms・super-slow (最大 50) 4000ms で 1 周。各モードは入った時にホイールが回っていればその速さのアニメを
#   始め、ほかの速さのアニメは止める (同じティックでは後ろの枝が勝つ)。切り替わる時に弧は 0 度から回り直す。
spin-fast-animation.duration-millis=300
spin-fast-animation.repeat=loop
spin-slow-animation.duration-millis=2000
spin-slow-animation.repeat=loop
spin-superslow-animation.duration-millis=4000
spin-superslow-animation.repeat=loop
normal-mode.spin-animation.start=+iswheeling | _{iswheeling} #{*}-0
normal-mode.spin-animation.stop=-iswheeling
normal-mode.spin-fast-animation.stop=#{*}-0
normal-mode.spin-slow-animation.stop=#{*}-0
normal-mode.spin-superslow-animation.stop=#{*}-0
# ctrl を押したまま回している間はズーム (33m) なので弧は出さない (2026-10-20 ユーザー「ズームしている時にはスクロールのアニメはいらない」)
normal-mode.spin-indicator.enabled=false | _{iswheeling} -> true | _{iswheeling leftctrl} -> false
normal-mode.spin-indicator.shape=circle
normal-mode.spin-indicator.size=36
normal-mode.spin-indicator.fill-opacity=0
normal-mode.spin-indicator.stroke-thickness=3
# 弧は白: 回している間は赤丸自体が黄色になる ([32] の fill-color 分岐) ので、黄色の弧だと見分けがつかない
normal-mode.spin-indicator.stroke-color=#FFFFFF
normal-mode.spin-indicator.stroke-opacity=0.9
normal-mode.spin-indicator.stroke-length-percent=0.25
normal-mode.spin-indicator.stroke-cap=round
# 向き: 下 (m) と右 (o) は時計回り、上 (wheelup) と左 (u) は逆再生 (反時計回り)。後ろの枝が勝つ。
normal-mode.spin-indicator.rotation=0 | _{spinanimation} -> 0% 0; 100% 360 | _{spinanimation wheelup} -> 0% 0; 100% -360 | _{spinanimation wheelleft} -> 0% 0; 100% -360 | _{spinfastanimation} -> 0% 0; 100% 360 | _{spinfastanimation wheelup} -> 0% 0; 100% -360 | _{spinfastanimation wheelleft} -> 0% 0; 100% -360 | _{spinslowanimation} -> 0% 0; 100% 360 | _{spinslowanimation wheelup} -> 0% 0; 100% -360 | _{spinslowanimation wheelleft} -> 0% 0; 100% -360 | _{spinsuperslowanimation} -> 0% 0; 100% 360 | _{spinsuperslowanimation wheelup} -> 0% 0; 100% -360 | _{spinsuperslowanimation wheelleft} -> 0% 0; 100% -360

# ---- 33m ズーム中 (ctrl+, = 拡大 / ctrl+m = 縮小) ----------------------------------------------
#   2026-10-20 ユーザー「ctrl+m と ctrl+, でズームしている時のアニメーションも作れない？」「ズームしている時には
#   スクロールのアニメはいらない」→ 虫眼鏡＋青い輪の初版は「微妙、もっとわかりやすく」→ 2 案を GIF で見て
#   「虫眼鏡はいらない、青いのだけでいい、ズームする時間は短いのでその間にわかる必要がある」。
#   ctrl を押したままホイールを回している間 (ほとんどのアプリで ctrl+ホイール = ズーム。Claude では [7b] が
#   ctrl+= / ctrl+- も送る)、赤丸を囲む青い四隅の枠が 0.4 秒で 1 回、拡大なら外へ開いて消え、縮小なら外から
#   内へ閉じてくる (動き出しが速い exponential-out-3、最初のコマから見える)。押し続ければくり返す (zoom-in/out)。
#   短く押しても 1 回分は最後まで見せる: 同じきっかけで once のアニメ (zoom-in-once / zoom-out-once、止めない) を
#   同時に始める。同じ長さで同時に始まるので、ループを途中で止めても once が同じ位置から続きを描く
#   (枝はループが後ろ = 押している間はループが勝つ)。スクロールの弧は隠す (33d)。
#   始まり: ctrl を押してから , / m (_{leftctrl wheelup} +iswheeling)、または回している途中で ctrl (#leftctrl は食わない)。
#   ハーネス M69、プレビューは anim-gif/make-gif.sh zoom。
zoom-in-animation.duration-millis=400
zoom-in-animation.repeat=loop
zoom-out-animation.duration-millis=400
zoom-out-animation.repeat=loop
zoom-in-once-animation.duration-millis=400
zoom-out-once-animation.duration-millis=400
normal-mode.zoom-in-animation.start=_{leftctrl wheelup} +iswheeling | _{wheelup iswheeling} #leftctrl
normal-mode.zoom-in-animation.stop=-iswheeling | -leftctrl
normal-mode.zoom-in-once-animation.start=_{leftctrl wheelup} +iswheeling | _{wheelup iswheeling} #leftctrl
normal-mode.zoom-out-animation.start=_{leftctrl wheeldown} +iswheeling | _{wheeldown iswheeling} #leftctrl
normal-mode.zoom-out-animation.stop=-iswheeling | -leftctrl
normal-mode.zoom-out-once-animation.start=_{leftctrl wheeldown} +iswheeling | _{wheeldown iswheeling} #leftctrl
